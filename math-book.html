<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   尺寸与常量（场景单位 ≈ 厘米）
   ================================================================ */
const W = 10, H = 14;               // 单页宽高
const T = 0.55;                     // 单侧书页厚度
const CV = 0.12, MG = 0.28;         // 封面板厚度、封面外延
const CW = 1100, CH = 1540;         // 页面贴图像素
const PX = CW / W;                  // 每单位像素
const UNIT = 0.62, NMAX = 6;        // 数轴：单位长度、刻度范围 ±6
const ZL = 1.5;                     // 数轴在右页上的位置（页面坐标 z）
const LEN = NMAX * UNIT + 0.34;     // 数轴半长
const BAR_H = 0.12;
const LIFT = 1.3;                   // 立起后模型整体离开书页的高度
const RIB_Y = 1.45, RIB_T = 0.04, RIB_D = 0.3;

const C = {
  ink: '#2a2521', soft: '#5f564e', gray: '#9b9187', line: '#d8cdbb',
  orange: '#e8641e', orangeL: '#f6a35d', paper: '#f7f2e7', card: '#fbf7ee',
  hl: 'rgba(255, 158, 64, 0.30)', box: '#fbefdc',
};
const F_CN = '"Noto Serif SC", "Songti SC", "SimSun", serif';
const F_HAND = '"Ma Shan Zheng", "KaiTi", "STKaiti", cursive';
const F_MATH = '"Times New Roman", "Times", "Noto Serif SC", serif';

/* ================================================================
   状态
   ================================================================ */
const S = {
  opened: false, spread: 0, busy: false, playing: false,
  built: [false, false, false, false],
  step: [0, 0, 0, 0],
  a: -3, b: 5, revealed: 0, view: 'read', sub: null,
};

/* ================================================================
   工具：缓动、补间
   ================================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  lin: t => t,
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  bounce: t => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
    return n * (t -= 2.625 / d) * t + .984375;
  },

const CANCEL = Symbol('cancel');
const tweens = [];
function tween(dur, fn, ez = ease.io, ctl = null) {
  return new Promise((res, rej) => tweens.push({ t0: performance.now(), dur, fn, ez, res, rej, ctl }));
}
const wait = (ms, ctl) => tween(ms, () => {}, ease.lin, ctl);
function runTweens(now) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const t = tweens[i];
    if (t.ctl && t.ctl.cancelled) { tweens.splice(i, 1); t.rej(CANCEL); continue; }
    const p = Math.min(1, (now - t.t0) / t.dur);
    t.fn(t.ez(p));
    if (p >= 1) { tweens.splice(i, 1); t.res(); }
  }
}

const fmt = n => (n < 0 ? '−' : '') + (Number.isInteger(n) ? Math.abs(n) : Math.abs(n).toFixed(1));
const paren = n => n < 0 ? `(${fmt(n)})` : fmt(n);

/* ================================================================
   排版引擎：中文 + 数学混排（斜体字母、分数、高亮）
   语法：{b:粗体} {o:橙色} {g:灰色} {w:白色}  ⟦分子¦分母⟧  \n 换行
   ================================================================ */
const USED = new Set();
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const OPS = '=+−×÷<>≤≥';
const NO_START = '，。、；：！？）》”,.;:!?)';

function tokenize(str) {
  USED.add(str);
  const toks = [], st = [];
  const cur = () => ({ bold: st.includes('b'), col: [...st].reverse().map(k => ({ o: C.orange, g: C.gray, w: '#fff' })[k]).find(Boolean) || null });
  let i = 0;
  while (i < str.length) {
    const c = str[i];
    if (c === '{' && str[i + 2] === ':') { st.push(str[i + 1]); i += 3; continue; }
    if (c === '}' && st.length) { st.pop(); i++; continue; }
    if (c === '\n') { toks.push({ t: 'nl' }); i++; continue; }
    if (c === '⟦') {
      const j = str.indexOf('⟧', i); const [num, den] = str.slice(i + 1, j).split('¦');
      toks.push({ t: 'frac', num, den, ...cur() }); i = j + 1; continue;
    }
    const prev = [...toks].reverse().find(t => t.t !== 'sp');
    const unary = c === '−' && /[0-9]/.test(str[i + 1] || '') &&
      (!prev || (prev.t === 'text' && !/[A-Za-z0-9)|]$/.test(prev.s)));
    if (/[A-Za-z0-9.]/.test(c) || unary) {
      let j = i + 1; const re = /[A-Za-z]/.test(c) ? /[A-Za-z]/ : /[0-9.]/;
      while (j < str.length && re.test(str[j])) j++;
      toks.push({ t: 'text', s: str.slice(i, j), ...cur() }); i = j; continue;
    }
    if (c === ' ') { toks.push({ t: 'sp', s: ' ' }); i++; continue; }
    toks.push({ t: 'text', s: c, ...cur() }); i++;
  }
  return toks;
}
function tokFont(t, size) {
  const b = t.bold ? 'bold ' : '';
  if (/^[A-Za-z]+$/.test(t.s)) return `italic ${b}${Math.round(size * 1.1)}px ${F_MATH}`;
  if (/^[−0-9.]+$/.test(t.s) || /^[+−=()|÷×<>\/:%≤≥]$/.test(t.s)) return `${b}${Math.round(size * 1.08)}px ${F_MATH}`;
  return `${t.bold ? 700 : 400} ${size}px ${F_CN}`;
}
function inlineW(ctx, str, size) { return tokenize(str).reduce((w, t) => w + tokW(ctx, t, size), 0); }
function drawInline(ctx, str, x, base, size, color) {
  for (const t of tokenize(str)) { drawTok(ctx, t, x, base, size, color); x += tokW(ctx, t, size); }
}
function tokW(ctx, t, size) {
  if (t.t === 'nl') return 0;
  if (t.t === 'sp') return size * 0.22;
  if (t.t === 'frac') { const s2 = size * 0.8; return Math.max(inlineW(ctx, t.num, s2), inlineW(ctx, t.den, s2)) + size * 0.36; }
  ctx.font = tokFont(t, size);
  let w = ctx.measureText(t.s).width;
  if (OPS.includes(t.s)) w += size * 0.26;
  if (/^[A-Za-z]+$/.test(t.s)) w += size * 0.06;
  return w;
}
function drawTok(ctx, t, x, base, size, color) {
  const col = t.col || color;
  if (t.t === 'sp' || t.t === 'nl') return;
  if (t.t === 'frac') {
    const s2 = size * 0.8, w = tokW(ctx, t, size), cx = x + w / 2;
    const bar = base - size * 0.32;
    const wn = inlineW(ctx, t.num, s2), wd = inlineW(ctx, t.den, s2);
    drawInline(ctx, t.num, cx - wn / 2, bar - size * 0.2, s2, col);
    drawInline(ctx, t.den, cx - wd / 2, bar + s2 * 0.98, s2, col);
    ctx.fillStyle = col; ctx.fillRect(x + size * 0.12, bar - size * 0.03, w - size * 0.24, Math.max(2, size * 0.055));
    return;
  }
  ctx.font = tokFont(t, size); ctx.fillStyle = col;
  ctx.fillText(t.s, x + (OPS.includes(t.s) ? size * 0.13 : 0), base);
}
function layout(ctx, str, size, maxW, lh = size * 1.62) {
  const lines = []; let cur = { toks: [], w: 0, frac: false };
  for (const t of tokenize(str)) {
    if (t.t === 'nl') { lines.push(cur); cur = { toks: [], w: 0, frac: false }; continue; }
    t.w = tokW(ctx, t, size);
    const noStart = t.t === 'text' && NO_START.includes(t.s);
    if (cur.w + t.w > maxW && cur.toks.length && !noStart) {
      lines.push(cur); cur = { toks: [], w: 0, frac: false };
      if (t.t === 'sp') continue;
    }
    cur.toks.push(t); cur.w += t.w; if (t.t === 'frac') cur.frac = true;
  }
  if (cur.toks.length) lines.push(cur);
  let h = 0; for (const l of lines) { l.h = l.frac ? Math.max(lh, size * 2.5) : lh; h += l.h; }
  return { lines, h, size, w: Math.max(0, ...lines.map(l => l.w)) };
}
function drawLay(ctx, lay, x, top, color = C.ink, align = 'left', boxW = 0) {
  let y = top;
  for (const l of lay.lines) {
    let cx = align === 'center' ? x + (boxW - l.w) / 2 : align === 'right' ? x + boxW - l.w : x;
    const base = l.frac ? y + l.h / 2 + lay.size * 0.5 : y + l.h / 2 + lay.size * 0.36;
    for (const t of l.toks) { drawTok(ctx, t, cx, base, lay.size, color); cx += t.w; }
    y += l.h;
  }
  return y;
}
function para(ctx, str, x, top, maxW, size = 30, opt = {}) {
  const lay = layout(ctx, str, size, maxW, opt.lh || size * 1.62);
  return drawLay(ctx, lay, x, top, opt.color || C.ink, opt.align || 'left', maxW);
}
function text(ctx, s, x, y, font, color = C.ink, align = 'left', spacing = 0) {
  USED.add(s);
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align;
  if ('letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
  ctx.fillText(s, x, y);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  ctx.textAlign = 'left';
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function hand(ctx, s, x, y, size, rot = -0.04, color = C.orange, align = 'left') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); text(ctx, s, 0, 0, `${size}px ${F_HAND}`, color, align); ctx.restore();
}
// 手绘感马克笔高亮
function marker(ctx, x, y, w, h) {
  ctx.save(); ctx.fillStyle = C.hl; ctx.beginPath();
  ctx.moveTo(x + 4, y + 3); ctx.lineTo(x + w - 2, y); ctx.lineTo(x + w + 3, y + h - 4); ctx.lineTo(x - 2, y + h);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.orange; ctx.fillRect(x - 14, y + 4, 5, h - 8);
  ctx.restore();
}

/* ================================================================
   纸张与页面框架
   ================================================================ */
const PAPER = (() => {
  const c = mk(CW, CH), x = c.getContext('2d');
  x.fillStyle = C.paper; x.fillRect(0, 0, CW, CH);
  const img = x.getImageData(0, 0, CW, CH), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 9; d[i] += n; d[i + 1] += n; d[i + 2] += n * 1.1; }
  x.putImageData(img, 0, 0);
  x.strokeStyle = 'rgba(120, 100, 70, 0.05)'; x.lineWidth = 1;
  for (let i = 0; i < 380; i++) {
    const px = Math.random() * CW, py = Math.random() * CH, a = Math.random() * 6.28, l = 6 + Math.random() * 18;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a) * l * .6, py + Math.sin(a + .6) * l * .6, px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
  }
  return c;
})();

function pageBase(ctx, side, pageNo, header) {
  ctx.drawImage(PAPER, 0, 0);
  const g = side === 'R' ? ctx.createLinearGradient(0, 0, 170, 0) : ctx.createLinearGradient(CW, 0, CW - 170, 0);
  g.addColorStop(0, 'rgba(70, 50, 28, 0.30)'); g.addColorStop(.25, 'rgba(70, 50, 28, 0.10)'); g.addColorStop(1, 'rgba(70, 50, 28, 0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  const g2 = side === 'R' ? ctx.createLinearGradient(CW, 0, CW - 40, 0) : ctx.createLinearGradient(0, 0, 40, 0);
  g2.addColorStop(0, 'rgba(70, 50, 28, 0.08)'); g2.addColorStop(1, 'rgba(70, 50, 28, 0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, CW, CH);
  const x0 = side === 'L' ? 120 : 140, x1 = side === 'L' ? 970 : 980;
  if (header) {
    text(ctx, header, side === 'L' ? x0 : x1, 84, `400 22px ${F_CN}`, C.gray, side === 'L' ? 'left' : 'right', 3);
    ctx.fillStyle = C.line; ctx.fillRect(x0, 104, x1 - x0, 1.5);
  }
  if (pageNo !== '') text(ctx, String(pageNo), side === 'L' ? x0 : x1, 1484, `24px ${F_MATH}`, C.gray, side === 'L' ? 'left' : 'right');
}
const LX = 120, LW = 850;   // 左页正文区
const RX = 140, RW = 840;   // 右页正文区

function sectionHead(ctx, x, y, tagStr, title, sub) {
  ctx.font = `700 22px ${F_CN}`; const tw = ctx.measureText(tagStr).width + 28;
  rr(ctx, x, y, tw, 38, 19); ctx.fillStyle = C.orange; ctx.fill();
  text(ctx, tagStr, x + 14, y + 27, `700 22px ${F_CN}`, '#fff', 'left', 2);
  text(ctx, title, x, y + 118, `900 62px ${F_CN}`, C.ink);
  text(ctx, sub, x, y + 162, `italic 26px ${F_MATH}`, C.gray, 'left', 1);
  return y + 200;
}
function heading(ctx, s, x, y) {
  ctx.fillStyle = C.orange; ctx.fillRect(x, y - 24, 8, 28);
  text(ctx, s, x + 20, y, `700 32px ${F_CN}`, C.ink, 'left', 2);
  return y + 30;
}
function numDot(ctx, label, cx, cy, on) {

    show(i, x, str, ctl) {

/* ---- 第 1 节立体：数轴三要素 ---- */
function makeLineScene() {
  const root = contentRoot(), pieces = [];

  // P / Q

/* ---- 第 2、3 节立体：对折求中点 ---- */
function makeMidScene(getAB, onStep, abs) {
  const root = contentRoot(), pieces = [];
  buildAxis(root, pieces, false);
  const counters = makeCounters(root);
  const A = makePin('A'), B = makePin('B'), Mp = makePin('M', { orange: true, height: 3.1 });
  root.add(A.g, B.g, Mp.g);
  pieces.push({ obj: A.g, kind: 'card', rot: 0, delay: .6 }, { obj: B.g, kind: 'card', rot: 0, delay: .7 });
  // 彩带（左半固定，右半绕折痕翻折）
  const fold = new THREE.Group(); root.add(fold);
  const gl = new THREE.BoxGeometry(1, RIB_T, RIB_D); gl.translate(-0.5, 0, 0);
  const gr = new THREE.BoxGeometry(1, RIB_T, RIB_D); gr.translate(0.5, 0, 0);
  const ribL = ink(M(gl, matOrange)), hingeR = new THREE.Group(), ribR = ink(M(gr, matOrange));
  hingeR.position.y = RIB_T * 1.2; ribR.position.y = -RIB_T * 1.2; hingeR.add(ribR); fold.add(ribL, hingeR);
  const lblAB = floatCard(2.5, 0.5), lblHalf = floatCard(2.9, 0.5), lblF = floatCard(3.6, 1.0, -0.3), lblL = floatCard(1.3, 0.44), lblR = floatCard(1.3, 0.44);
  root.add(lblAB.hinge, lblHalf.hinge, lblF.hinge, lblL.hinge, lblR.hinge);
  const walker = makeWalker(root);
  const X = v => v * UNIT;
  function setRib(len, total) {
    const half = total / 2;
    ribL.scale.x = Math.max(0.001, Math.min(len, half)); ribL.position.x = ribL.scale.x - half;
    ribR.visible = len > half + 1e-4; ribR.scale.x = Math.max(0.001, len - half);
  }
  function place() {
    const { a, b } = getAB();
    A.set(fmt(a)); B.set(fmt(b));
    A.g.position.set(X(a), BAR_H, ZL); B.g.position.set(X(b), BAR_H, ZL - (a === b ? 0.0 : 0));
    B.g.position.z = ZL + (a === b ? 0.3 : 0);
  }
  function reset() {
    place(); fold.visible = false; hingeR.rotation.z = 0; ribR.material = matOrange;
    Mp.g.visible = false; walker.visible = false; counters.clear();
    [lblAB, lblHalf, lblF, lblL, lblR].forEach(l => l.reset());
  }
  reset();
  return {
    root, pieces, place, reset, A, B,
    async play(ctl) {
      reset();
      const { a, b } = getAB(), lo = Math.min(a, b), hi = Math.max(a, b), d = hi - lo, m = (a + b) / 2, total = X(d);
      onStep(1);
      await Promise.all([bob(A.g, ctl), bob(B.g, ctl)]);
      if (d > 0) {
        fold.position.set(X(m), RIB_Y, ZL); fold.visible = true; setRib(0, total);
        await tween(500 + d * 110, p => setRib(p * total, total), ease.io, ctl);
        lblAB.hinge.position.set(X(m), RIB_Y - 0.6, ZL + 0.5);
        await lblAB.show(abs ? `AB = |b − a| = {o:${fmt(d)}}` : `AB = b − a = {o:${fmt(d)}}`, { size: .5 }, ctl);
      }
      await wait(1300, ctl); await speakWait(ctl); onStep(1.5);
      if (d > 0) await lblAB.hide(ctl);
      onStep(2);
      if (d > 0) {
        ribR.material = matOrangeD;
        await tween(1400, p => hingeR.rotation.z = Math.PI * p, ease.io, ctl);
        lblHalf.hinge.position.set(X((lo + m) / 2), RIB_Y - 0.6, ZL + 0.5);
        await lblHalf.show(`每一半 = ${fmt(d)} ÷ 2 = {o:${fmt(d / 2)}}`, { size: .5 }, ctl);
        await wait(1300, ctl);
        await lblHalf.hide(ctl);
      } else await wait(800, ctl);
      await speakWait(ctl); onStep(2.5);
      onStep(3);
      // 中点小旗从折痕处落下
      Mp.set(fmt(m)); Mp.g.position.set(X(m), BAR_H + 4.4, ZL - 0.02); Mp.g.rotation.x = 0; Mp.g.visible = true;
      await tween(950, p => Mp.g.position.y = BAR_H + 4.4 * (1 - p), ease.bounce, ctl);
      if (d > 0) await tween(1000, p => hingeR.rotation.z = Math.PI * (1 - p), ease.io, ctl);
      // 小球从 A 出发走 AM 到 M
      walker.position.set(X(lo), BAR_H + 0.13, ZL); walker.visible = true;
      for (let v = lo, c = 0; v < m - 1e-6; c++) { const nv = Math.min(m, v + 1); await hop(walker, X(v), X(nv), ctl); counters.show(c, X(nv), fmt(nv - lo), ctl); v = nv; }
      await wait(250, ctl); walker.visible = false;
      await speakWait(ctl); onStep(3.5);
      onStep(4); counters.clear();
      await wait(1500, ctl); subLine(2);
      await wait(1500, ctl); subLine(3);
      lblF.hinge.position.set(X(m), BAR_H + 3.35, ZL - 0.05);
      const fp = lblF.show(`m = ⟦a + b¦2⟧ = ⟦${fmt(a)} + ${paren(b)}¦2⟧ = {o:${fmt(m)}}`, { size: .36 }, ctl);
      if (total / 2 > 1.35) {
        lblL.hinge.position.set(X((lo + m) / 2), RIB_Y - 0.55, ZL + 0.5);
        lblR.hinge.position.set(X((m + hi) / 2), RIB_Y - 0.55, ZL + 0.5);
        lblL.show(`AM = ${fmt(d / 2)}`, { size: .52 }, ctl); lblR.show(`MB = ${fmt(d / 2)}`, { size: .52 }, ctl);
      }
      await fp;
      await wait(900, ctl); await speakWait(ctl);
      onStep(5);
    },
  };
}

/* ================================================================
   组装：各页立体场景
   ================================================================ */
let SCENES = [];
/* ---- 讲解卡：播放时在屏幕上正对用户显示当前步骤 ---- */
const LINE_NARR = [
  { t: '原点 O', b: '数轴上表示 0 的点叫做原点，它把数轴分成正、负两部分。', f: '原点 O 表示 {o:0}' },
  { t: '正方向', b: '箭头所指的方向是正方向，通常取向右。越往右，表示的数越大。', f: '−2 < 0 < 3' },
  { t: '单位长度', b: '相邻两个刻度之间的距离都相等。小球从原点向右跳 3 个单位长度，到达点 P。', f: '点 P 表示 {o:3}' },
  { t: '读一读', b: '再从 P 向左跳 5 个单位长度，到达点 Q。原点右边的点表示正数，左边的点表示负数。', f: '点 Q 表示 {o:−2}' },

function midNarr(a, b, abs) {
  const lo = Math.min(a, b), d = Math.abs(b - a), m = (a + b) / 2;
  return [
    abs ? { t: '量距离', b: '在 A、B 两面小旗之间拉一条彩带，彩带的长度就是两点之间的距离。不知道谁在左边时，取绝对值，距离总是正数。',
      f: `AB = |b − a| = |${fmt(b)} − ${paren(a)}| = {o:${fmt(d)}}` }
      : { t: '量距离', b: '在 A、B 两面小旗之间拉一条彩带，彩带的长度就是两点之间的距离。B 在右边，用右边的数减左边的数。',
      f: `AB = b − a = ${fmt(b)} − ${paren(a)} = {o:${fmt(d)}}` },
    { t: '对折平分', b: '把彩带从中间对折，两半完全重合——说明两半一样长，每一半都是 AB 的一半。',
      f: `每一半 = ⟦AB¦2⟧ = ⟦${fmt(d)}¦2⟧ = {o:${fmt(d / 2)}}` },
    { t: '折痕落下', b: `折痕的位置就是中点 M，所以 AM = MB = ${fmt(d / 2)}。从左端点出发向右走 ${fmt(d / 2)} 个单位，正好到达 M。`,
      f: `m = ${fmt(lo)} + ${fmt(d / 2)} = {o:${fmt(m)}}` },
    { t: '中点公式', b: '用字母写出“从 A 走 AB 的一半”，再通分化简：',
      f: [`m = a + ⟦b − a¦2⟧`, `= ⟦2a + b − a¦2⟧`, `= ⟦a + b¦2⟧ = ⟦${fmt(a)} + ${paren(b)}¦2⟧ = {o:${fmt(m)}}`],
      tail: '所以中点表示的数，就是两个端点表示的数的平均数。' },

}
const NARR = { 1: () => LINE_NARR, 2: () => midNarr(-2, 4, false), 3: () => midNarr(S.a, S.b, true) };
function narrate(i, k) {
  if (!k || !NARR[i]) return;
  const s = NARR[i]()[k - 1];
  S.sub = { i, k, n: Array.isArray(s.f) ? 1 : 99 }; redraw(i, 'R');
  const f = [].concat(s.f).map(spoken).join('，');
  speak(`第${'一二三四'[k - 1]}步，${s.t}。${spoken(s.b)}${f}。${s.tail || ''}`);

// 多行公式逐行出现
function subLine(n) { if (S.sub) { S.sub.n = n; redraw(S.sub.i, 'R'); } }
function hideNarr() {
  stopSpeech();
  if (S.sub) { const i = S.sub.i; S.sub = null; redraw(i, 'R'); }
}

/* ---- 语音朗读（Web Speech API） ---- */
const TTS = window.speechSynthesis || null;
let voiceOn = true, speaking = false, speakTimer = 0, zhVoice = null, curUtter = null;
try { voiceOn = localStorage.getItem('popbook-voice') !== 'off'; } catch (e) {}
function pickVoice() {
  if (!TTS) return;
  const vs = TTS.getVoices().filter(v => /^zh(-|_)?(CN|Hans)?/i.test(v.lang) && !/HK|TW/i.test(v.lang));
  zhVoice = vs.find(v => /Xiaoxiao|Yunxi|Natural|Online/i.test(v.name)) || vs.find(v => /Google/i.test(v.name)) || vs[0] || null;
}
if (TTS) { pickVoice(); TTS.addEventListener?.('voiceschanged', pickVoice); }
// 把公式写法转成适合朗读的中文
function spoken(f) {
  return f.replace(/[{][a-z]:|[}]/g, '')
    .replace(/⟦([^¦]+)¦([^⟧]+)⟧/g, (_, n, dn) => {
      const plus = n.includes('+'), minus = /\s−\s/.test(n);
      if (plus && minus) return ` ${n}，整体除以 ${dn} `;
      if (plus || minus) return ` ${n} 的${plus ? '和' : '差'}除以 ${dn} `;
      return ` ${dn}分之${n} `;
    })
    .replace(/\|([^|]+)\|/g, ' $1的绝对值 ')
    .replace(/ − /g, ' 减 ').replace(/−/g, '负')
    .replace(/\+/g, ' 加 ').replace(/=/g, ' 等于 ').replace(/÷/g, ' 除以 ').replace(/</g, ' 小于 ')
    .replace(/[()]/g, '').replace(/\s+/g, ' ').trim();
}
function speak(text) {
  const busy = TTS && (TTS.speaking || TTS.pending);

  const u = new SpeechSynthesisUtterance(text);

  curUtter = u;
  u.onend = u.onerror = () => { if (curUtter === u) { speaking = false; clearTimeout(speakTimer); } };
  speaking = true;
  // 兜底：个别浏览器不触发 onend 时，按字数估算时长后放行
  speakTimer = setTimeout(() => { speaking = false; }, 2500 + text.length * 260);

  const go = () => { if (curUtter === u) { TTS.resume?.(); TTS.speak(u); } };

}
function stopSpeech() {

}
function speakWait(ctl) {
  return new Promise((res, rej) => {
    const chk = () => ctl.cancelled ? rej(CANCEL) : !speaking ? res() : requestAnimationFrame(chk);
    chk();
  });
}
function setVoice(on) {
  voiceOn = on;
  try { localStorage.setItem('popbook-voice', on ? 'on' : 'off'); } catch (e) {}
  if (!on) stopSpeech();
  $('bVoice').classList.toggle('muted', !on);
  $('bVoice').title = on ? '语音讲解：开（点击静音）' : '语音讲解：关（点击开启）';
}
function buildScenes() {
  SCENES = [
    null,
    makeLineScene(),
    makeMidScene(() => ({ a: -2, b: 4 }), k => {
      // 2 号场景：左页高亮步骤 + 右页步骤条
      if (k === Math.floor(k)) { S.step[2] = k > 4 ? 0 : k; redraw(2, 'L'); redraw(2, 'R'); narrate(2, S.step[2]); }
    }),
    makeMidScene(() => ({ a: S.a, b: S.b }), k => {
      // 3 号场景：每完成一步揭晓一项计算结果
      if (k === 1.5) S.revealed = Math.max(S.revealed, 1);
      else if (k === 2.5) S.revealed = Math.max(S.revealed, 2);
      else if (k === 3.5) S.revealed = Math.max(S.revealed, 3);
      else if (k === 5) S.revealed = 4;
      if (k === Math.floor(k)) { S.step[3] = k > 4 ? 0 : k; narrate(3, S.step[3]); }
      redraw(3, 'L');
    }, true),

}

/* ================================================================
   交互：打开、翻页、立体化、播放
   ================================================================ */
let playCtl = null;
function cancelPlay() {
  if (playCtl) playCtl.cancelled = true;
  hideNarr();
  playCtl = null; S.playing = false;
  const sc = SCENES[S.spread];
  if (sc) sc.reset();
  if (S.spread === 2) { S.step[2] = 0; redraw(2, 'L'); redraw(2, 'R'); }
  if (S.spread === 3) { S.step[3] = 0; redraw(3, 'L'); }
  ui();
}
async function setBuilt(on, fast = false) {
  const i = S.spread, sc = SCENES[i];
  if (!sc || S.built[i] === on || S.busy) return;
  if (!on) cancelPlay();
  S.busy = true; S.built[i] = on; redraw(i, 'R'); ui();
  applyPop(sc.pieces, on ? 0 : 1); sc.root.visible = true;
  S.view = on ? 'anim' : 'read';
  await Promise.all([
    tween(fast ? 600 : 1600, p => { const q = on ? p : 1 - p; applyPop(sc.pieces, q); setLift(sc.root, ease.io(q)); }, ease.lin),
    flyTo(on ? animView() : openView(), fast ? 600 : 1300),

  S.busy = false; ui();
}
async function play() {
  const sc = SCENES[S.spread];
  if (!sc || S.busy) return;
  if (!S.built[S.spread]) await setBuilt(true);
  cancelPlay();
  const ctl = playCtl = { cancelled: false };
  S.playing = true; ui();
  try { await sc.play(ctl); }
  catch (e) { if (e !== CANCEL) console.error(e); }
  if (playCtl === ctl) { playCtl = null; S.playing = false; ui(); }
}
async function flip(dir, fast = false) {
  const cur = S.spread, next = cur + dir;
  if (S.busy || !S.opened || next < 0 || next >= SPREADS.length) return;
  if (S.built[cur]) await setBuilt(false, true);
  cancelPlay();
  const lift = peekLast === dir ? peekCur : 0;
  peek = peekLast = 0; peekCur = 0;
  S.busy = true; closeMenu(); ui();
  const P = PAGE_CANVAS;
  if (dir > 0) { useImage(texFF, P[cur].R); useImage(texFB, P[next].L); useImage(texR, P[next].R); }
  else { useImage(texFF, P[next].R); useImage(texFB, P[cur].L); useImage(texL, P[next].L); }
  flipGroup.visible = true;
  await tween(fast ? 520 : 950, p => {
    const th = dir > 0 ? p * Math.PI : (1 - p) * Math.PI;
    const c0 = PEEK_CURL * lift * (1 - p);
    setFlip(th, (dir > 0 ? -1 : 1) * 0.9 * Math.sin(p * Math.PI) + (dir > 0 ? c0 : -c0));
  }, ease.io);
  if (dir > 0) useImage(texL, P[next].L); else useImage(texR, P[next].R);
  flipGroup.visible = false;
  S.spread = next; S.busy = false; ui();
}
async function goTo(target) {
  closeMenu();
  while (S.spread !== target && !S.busy) await flip(Math.sign(target - S.spread), Math.abs(target - S.spread) > 1);
}

// ---- 相机
const controls = new OrbitControls(camera, renderer.domElement);
function openView() {
  const elev = 0.8, a = innerWidth / innerHeight, f = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max(8.2 / f, 10.9 / (f * a));
  const target = new THREE.Vector3(0, T, 0.9);
  return { target, pos: target.clone().add(new THREE.Vector3(0, Math.sin(elev), Math.cos(elev)).multiplyScalar(d)) };
}
// 动画视角：仍框住整个跨页（左页同步文字可见），仰角略低，看清升起的模型
function animView() {
  const elev = 0.68, a = innerWidth / innerHeight, f = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max(7.6 / f, 10.4 / (f * a));
  const target = new THREE.Vector3(0, T + 1.0, 1.5);
  return { target, pos: target.clone().add(new THREE.Vector3(0, Math.sin(elev), Math.cos(elev)).multiplyScalar(d)) };
}
function closedView() {
  const { pos, target } = openView();
  const d = pos.distanceTo(target) * 0.78, t = new THREE.Vector3(0, 0.6, 0);
  return { target: t, pos: t.clone().add(new THREE.Vector3(Math.sin(0.35) * Math.cos(1.0), Math.sin(1.0), Math.cos(0.35) * Math.cos(1.0)).multiplyScalar(d)) };
}
async function flyTo(view, ms = 1000, extra) {
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  await tween(ms, p => { camera.position.lerpVectors(p0, view.pos, p); controls.target.lerpVectors(t0, view.target, p); extra && extra(p); }, ease.io);
}
async function openBook() {
  if (S.opened || S.busy) return;
  S.busy = true; hint(''); controls.enabled = false;
  await flyTo(openView(), 1900, p => setOpen(p));
  controls.enabled = true; S.opened = true; S.busy = false;
  document.getElementById('tb').classList.remove('off');
  ui();
}

/* ---- 指针：点击 / 拖拽小旗 ---- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(e, objs) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObjects(objs, true).find(h => h.object.isMesh);
}
let down = null, drag = null;
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), tmpV = new THREE.Vector3();
function dragTargets() {
  const sc = SCENES[S.spread];
  return S.spread === 3 && S.built[3] && !S.busy ? [sc.A.g, sc.B.g] : [];
}
renderer.domElement.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY };
  const tg = dragTargets();
  if (tg.length) {
    const hit = pick(e, tg);
    if (hit) {
      let o = hit.object; while (o && o !== tg[0] && o !== tg[1]) o = o.parent;
      drag = o === tg[0] ? 'a' : 'b'; controls.enabled = false;
      renderer.domElement.setPointerCapture(e.pointerId);
      dragPlane.constant = -(T + 0.004 + LIFT + BAR_H);
    }
  }
}, { capture: true });
renderer.domElement.addEventListener('pointermove', e => {
  if (drag) {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(dragPlane, tmpV)) {
      SCENES[3].root.worldToLocal(tmpV);
      const v = clamp(Math.round(tmpV.x / UNIT), -NMAX, NMAX);
      if (v !== S[drag]) setAB(drag, v);
    }
    return;
  }
  let cur = '', z = null;
  if (!S.opened) cur = pick(e, [book]) ? 'pointer' : '';
  else if (!S.busy) {
    if (dragTargets().length && pick(e, dragTargets())) cur = 'grab';
    else { z = zoneAt(e); if (z) cur = 'pointer'; }
  }
  setPeek(z === 'next' ? 1 : z === 'prev' ? -1 : 0);
  renderer.domElement.style.cursor = cur;
});
renderer.domElement.addEventListener('pointerup', e => {
  if (drag) { drag = null; controls.enabled = true; return; }
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
  if (!S.opened) { if (pick(e, [book])) openBook(); return; }
  if (S.busy) return;
  const z = zoneAt(e);
  if (z === 'build') setBuilt(true);
  else if (z === 'next') flip(1);
  else if (z === 'prev') flip(-1);
});
renderer.domElement.addEventListener('pointerleave', () => setPeek(0));

// 页面点击区域：插图区 → 立体化；左页外侧 → 上一页；右页插图以外 → 下一页
function zoneAt(e) {
  if (!S.opened || S.busy) return null;
  const sc = SCENES[S.spread];
  const objs = [leftPage, rightPage]; if (sc && sc.root.visible) objs.push(sc.root);
  const h = pick(e, objs);
  if (!h || !h.uv) return null;
  const x = (h.uv.x - 0.5) * W, z = (0.5 - h.uv.y) * H;
  if (h.object === leftPage) return S.spread > 0 && x < 0.5 ? 'prev' : null;
  if (h.object !== rightPage) return null;
  const inFig = sc && Math.abs(x) < 4.9 && z > ZL - 3.4 && z < ZL + 0.9;
  if (inFig) return S.built[S.spread] ? null : 'build';
  return S.spread < SPREADS.length - 1 && x > -0.5 ? 'next' : null;
}

// 悬停翻页区时，页角轻轻掀起
const PEEK_CURL = 0.32;
let peek = 0, peekLast = 0, peekCur = 0;
function restorePages() { useImage(texL, PAGE_CANVAS[S.spread].L); useImage(texR, PAGE_CANVAS[S.spread].R); }
function setPeek(d) {
  if (S.busy || (d > 0 && S.built[S.spread])) d = 0;
  if (d === peek) return;
  peek = d;
  if (!d) return;
  if (peekLast && peekLast !== d) restorePages();
  peekLast = d;
  const P = PAGE_CANVAS, i = S.spread;
  if (d > 0) { useImage(texFF, P[i].R); useImage(texFB, P[i + 1].L); useImage(texR, P[i + 1].R); }
  else { useImage(texFF, P[i - 1].R); useImage(texFB, P[i].L); useImage(texL, P[i - 1].L); }
}
function updatePeek() {
  if (S.busy || !peekLast) return;
  peekCur += ((peek ? 1 : 0) - peekCur) * 0.16;
  if (!peek && peekCur < 0.004) { peekCur = 0; peekLast = 0; flipGroup.visible = false; restorePages(); return; }
  flipGroup.visible = true;
  if (peekLast > 0) setFlip(0, PEEK_CURL * peekCur);
  else setFlip(Math.PI, -PEEK_CURL * peekCur);
}

function setAB(k, v) {
  S[k] = clamp(v, -NMAX, NMAX);
  if (playCtl) cancelPlay();
  S.revealed = 0; S.step[3] = 0;
  SCENES[3].place(); SCENES[3].reset();
  redraw(3, 'L'); redraw(3, 'R'); ui();
}

/* ================================================================
   UI
   ================================================================ */
const $ = id => document.getElementById(id);
let hintTimer = 0;
function hint(s) { const h = $('hint'); if (s) { h.textContent = s; h.classList.remove('off'); } else h.classList.add('off'); }
function ui() {
  const i = S.spread, sc = SCENES[i];
  $('pageLabel').innerHTML = `<b>${SPREADS[i].pn}</b>${SPREADS[i].title}`;
  $('bPrev').disabled = S.busy || i === 0;
  $('bNext').disabled = S.busy || i === SPREADS.length - 1;
  $('bBuild').disabled = !sc || S.busy;
  $('bBuild').classList.toggle('on', !!S.built[i]);
  $('bBuild').querySelector('.txt').textContent = S.built[i] ? '平面' : '立体';
  $('bPlay').disabled = !sc || S.busy;
  $('bPlay').querySelector('.txt').textContent = S.playing ? '重播' : '播放';
  $('ab').classList.toggle('hide', i !== 3);
  $('oa').textContent = fmt(S.a); $('ob').textContent = fmt(S.b);
  document.querySelectorAll('.menu button').forEach((b, k) => b.classList.toggle('cur', k === i));
  if (!S.opened) return;
  clearTimeout(hintTimer);
  let h = '';
  if (S.playing) { hint(''); return; }
  if (sc && !S.built[i] && !S.busy) h = '点击右页插图，让平面图形立起来';
  else if (i === 3 && S.built[3] && !S.playing && !S.busy) h = '拖动 A、B 小旗，或用工具栏 ± 设置坐标，再点 ▶';
  else if (sc && S.built[i] && !S.playing && !S.busy) h = '拖动旋转视角 · 点 ▶ 播放动画 · ⟲ 切换阅读视角';
  else if (i === 0 && !S.busy) h = '点击右页翻到下一页，点击左页回到上一页';
  hint(h);
  if (h) hintTimer = setTimeout(() => hint(''), 4200);
}
function closeMenu() { $('menu').classList.add('off'); }
$('menu').innerHTML = SPREADS.map((s, k) => `<button data-i="${k}">${s.title}<i>${s.pn}</i></button>`).join('');
$('menu').addEventListener('click', e => { const b = e.target.closest('button'); if (b) goTo(+b.dataset.i); });
$('bMenu').onclick = () => $('menu').classList.toggle('off');
$('bPrev').onclick = () => flip(-1);
$('bNext').onclick = () => flip(1);
$('bBuild').onclick = () => setBuilt(!S.built[S.spread]);
$('bPlay').onclick = () => play();
$('bVoice').onclick = () => setVoice(!voiceOn);
$('bView').onclick = () => {
  if (S.busy) return;
  S.view = S.built[S.spread] && S.view !== 'anim' ? 'anim' : 'read';
  flyTo(S.view === 'anim' ? animView() : openView(), 900);
};
document.querySelectorAll('.ab button').forEach(b => b.onclick = () => setAB(b.dataset.k, S[b.dataset.k] + +b.dataset.d));
addEventListener('keydown', e => {
  if (!S.opened) { if (e.key === 'Enter' || e.key === ' ') openBook(); return; }
  if (e.key === 'ArrowRight') flip(1);
  else if (e.key === 'ArrowLeft') flip(-1);
  else if (e.key === ' ') { e.preventDefault(); play(); }
  else if (e.key === 'Enter') setBuilt(!S.built[S.spread]);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================================================================
   启动：等字体 → 绘制 → 渲染循环
   ================================================================ */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function loadFonts() {
  const link = $('gfont');
  await Promise.race([new Promise(r => link.sheet ? r() : link.addEventListener('load', r, { once: true })), sleep(3000)]);
  redrawAll();   // 第一次绘制：收集用到的字符
  const sample = [...USED].join('') + '0123456789单位长度正方向原点';
  const loads = ['400', '700', '900'].map(w => document.fonts.load(`${w} 32px "Noto Serif SC"`, sample))
    .concat(document.fonts.load(`32px "Ma Shan Zheng"`, sample));
  await Promise.race([Promise.allSettled(loads), sleep(6000)]);
}

function frame(now) {
  runTweens(now);
  updatePeek();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

(async () => {
  Object.assign(controls, {
    enableDamping: true, dampingFactor: .08, enablePan: false,
    minDistance: 8, maxDistance: 46, minPolarAngle: 0.12, maxPolarAngle: 1.3,
    minAzimuthAngle: -1.3, maxAzimuthAngle: 1.3,
  });
  const v = closedView(); camera.position.copy(v.pos); controls.target.copy(v.target);
  buildScenes();
  await loadFonts();
  redrawAll();
  useImage(texL, PAGE_CANVAS[0].L); useImage(texR, PAGE_CANVAS[0].R);
  requestAnimationFrame(frame);
  $('loading').classList.add('off');
  ui();
  hint('点击书本，打开它');
  setVoice(voiceOn);
  document.fonts.addEventListener('loadingdone', () => redrawAll());
})();
</script>
</body>
</html>

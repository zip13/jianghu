/* Enemy motion follows the resolved combat round, never random cosmetic damage. */
.enemy-fighter{transform-origin:50% 90%;animation:enemy-breathe 2.8s ease-in-out infinite}
.enemy-wolf .enemy-fighter{animation:enemy-prowl 2.2s ease-in-out infinite}
.enemy-boss .enemy-fighter{animation:enemy-breathe 3.6s ease-in-out infinite}
.intent-heavy .enemy-fighter{filter:drop-shadow(0 0 9px #b85132);animation:enemy-windup 1s ease-in-out infinite}
.intent-rest .enemy-fighter{animation:enemy-breathe 1.1s ease-in-out infinite;opacity:.85}
.battle-field.enemy-strikes .enemy-fighter{animation:enemy-strike .65s ease-out both}
.battle-field.enemy-wolf.enemy-strikes .enemy-fighter{animation:wolf-pounce .65s ease-out both}
.battle-field.enemy-boss.enemy-strikes .enemy-fighter{animation:boss-cleave .65s ease-out both}
.player-heal{left:24%;top:20%;color:#3e7655;animation-delay:.13s}.battle-field.enemy-strikes .player-num{animation-delay:.42s}.battle-field .enemy-num{animation-delay:.13s}
.battle-field.enemy-strikes .player-fighter{animation:player-hit .65s ease-out both}
.battle-field.fx-defeat .enemy-fighter{animation:enemy-fall .48s .22s ease-in forwards}
.battle-field.fx-player-defeat .player-fighter{animation:enemy-fall .48s .22s ease-in forwards}
.battle-field.fx-attack.enemy-strikes .player-fighter,.battle-field.fx-skill.enemy-strikes .player-fighter{animation:player-exchange .65s ease-out both}
.battle-field.fx-potion .player-num{color:#aa4637}
@keyframes player-exchange{0%{transform:none}20%{transform:translateX(28px) rotate(4deg)}45%{transform:none}65%{transform:translateX(-9px);filter:brightness(1.6)}100%{transform:none;filter:none}}
@keyframes enemy-breathe{50%{transform:translateY(-3px) scaleY(1.015)}}
@keyframes enemy-prowl{50%{transform:translateX(-5px) translateY(2px)}}
@keyframes enemy-windup{50%{transform:translateX(5px) rotate(3deg)}}
@keyframes enemy-strike{15%{transform:translateX(7px);filter:brightness(1.4)}35%{transform:translateX(5px) rotate(5deg)}65%{transform:translateX(-30px) rotate(-7deg)}100%{transform:none}}
@keyframes wolf-pounce{15%{transform:translateX(6px);filter:brightness(1.4)}35%{transform:translateY(5px) scaleY(.94)}65%{transform:translate(-40px,-15px) rotate(-5deg)}100%{transform:none}}
@keyframes boss-cleave{15%{transform:translateX(6px);filter:brightness(1.4)}40%{transform:rotate(10deg) translateX(8px)}65%{transform:translateX(-24px) rotate(-10deg)}100%{transform:none}}
@keyframes player-hit{55%{transform:none}70%{transform:translateX(-9px);filter:brightness(1.6)}100%{transform:none}}
@keyframes enemy-fall{20%{filter:brightness(1.7);transform:translateX(8px)}100%{opacity:0;transform:translateY(24px) rotate(12deg)}}
@media(prefers-reduced-motion:reduce){.battle-field *{animation:none!important}.battle-field.fx-defeat .enemy-fighter,.battle-field.fx-player-defeat .player-fighter{opacity:.35}}

/* Thirty encounter illustrations: no changes to the battle presentation. */

.scene.encounter-scene:after{display:none}
.encounter-figure{margin:0;position:relative}
.encounter-picture{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:contain;background:#e4dfcb}
.encounter-caption{display:flex;align-items:center;gap:10px;margin:0;padding:10px 17px;background:#eae6d5;color:#4c6152;font-size:12px;line-height:1.55;border-bottom:1px solid #d2d0b9}
.encounter-caption:before{content:'画中';flex:none;font-family:"Songti SC","SimSun",serif;color:#965840;border:1px solid #b48c66;padding:2px 5px;font-size:11px;border-radius:2px}

</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="seal">江<br>湖</div><div><h1>江湖未晚</h1><div class="subtitle">三 十 日 行 记 · A WANDERER'S TALE</div></div></div><div class="top-actions"><div id="day" class="day"></div><button id="sfxToggle" onclick="toggleSfx()" aria-pressed="true" aria-label="音效开关">♪ 音效</button><button onclick="openHelp()" aria-label="玩法说明">玩法</button><button onclick="openSave()">存档</button></div></header><div id="mobileHud" class="mobile-hud" aria-label="当前状态"></div><div class="layout"><aside class="sidebar leftbar"><section class="panel"><div class="hero-art" id="portrait"></div><div id="hero" class="padded hero-body"></div></section><section class="panel padded"><div class="section-label">THE WAY YOU WALK</div><h2>江湖有回声</h2><div id="relations"></div></section></aside><main class="main panel"><div class="scene" id="scene"></div><nav class="nav" aria-label="游戏场景"><button data-tab="encounter" onclick="switchTab('encounter')"><span class="nav-icon" aria-hidden="true">◈</span><span class="nav-long">◈ 今日奇遇</span><span class="nav-short">奇遇</span></button><button data-tab="journey" onclick="switchTab('journey')"><span class="nav-icon" aria-hidden="true">⌁</span><span class="nav-long">⌁ 江湖历练</span><span class="nav-short">历练</span></button><button data-tab="shop" onclick="switchTab('shop')"><span class="nav-icon" aria-hidden="true">▧</span><span class="nav-long">▧ 青石集市</span><span class="nav-short">集市</span></button><button data-tab="bag" onclick="switchTab('bag')"><span class="nav-icon" aria-hidden="true">◇</span><span class="nav-long">◇ 行囊装备</span><span class="nav-short">行囊</span></button><button data-tab="quests" onclick="switchTab('quests')"><span class="nav-icon" aria-hidden="true">☷</span><span class="nav-long">☷ 因果·委托</span><span class="nav-short">因果</span></button></nav><div class="content" id="content" tabindex="-1"></div></main><aside class="sidebar rightbar"><section class="panel padded"><div class="section-label">A LITTLE EVERY DAY</div><h2>今日修行</h2><div id="actions"></div></section><section class="panel"><div class="padded" style="padding-bottom:0"><div class="section-label">YOUR FOOTPRINTS</div><h2>风物手记</h2></div><div class="journal" id="journal"></div></section><section class="panel padded"><div class="section-label">THE THIRTIETH NIGHT</div><p class="note" id="seasonNote"></p><button class="ghost" style="width:100%;font-size:12px" onclick="switchTab('quests')">翻开因果簿 →</button></section></aside></div><footer class="footer"><span>一人一剑，也能走出不同的江湖。 · 原创 AI 绘景与角色</span><span id="saveStatus">本地自动存档 · 离线可玩</span></footer></div><div class="mobile-tools" id="mobileTools"></div><div id="overlay"></div><div id="toastRoot" aria-live="polite"></div><div id="bannerRoot" aria-live="polite"></div><input type="file" id="importFile" accept="application/json,.json" class="hidden">
<script>
'use strict';
const KEY='jianghu-weiwan-v1';
const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ITEMS=[{id:'bamboo',name:'青竹剑',type:'weapon',atk:2,price:0,icon:'⚔',desc:'启程时削的竹剑。轻巧，也很倔强。'},{id:'iron',name:'百炼铁剑',type:'weapon',atk:6,price:65,icon:'⚔',desc:'攻击 +6。青石铁匠的踏实手艺。'},{id:'moon',name:'照月刀',type:'weapon',atk:11,price:150,icon:'⚔',desc:'攻击 +11。月下出鞘，刃若清霜。'},{id:'star',name:'流星古剑',type:'weapon',atk:18,price:300,icon:'⚔',desc:'攻击 +18。为敢踏险路的人而铸。'},{id:'cloth',name:'旧布衣',type:'armor',def:1,price:0,icon:'◈',desc:'防御 +1。缝补过，却还挡得住风。'},{id:'vest',name:'青藤软甲',type:'armor',def:4,price:55,icon:'◈',desc:'防御 +4。山藤编就，柔韧护身。'},{id:'silk',name:'云纹护衣',type:'armor',def:8,price:135,icon:'◈',desc:'防御 +8。内衬细鳞，轻若流云。'},{id:'scale',name:'玄鳞轻甲',type:'armor',def:13,price:260,icon:'◈',desc:'防御 +13。行走险境的可靠保障。'},{id:'jade',name:'安神玉',type:'charm',hp:20,price:85,icon:'◇',desc:'最大气血 +20。佩戴不恢复当前气血。'},{id:'tiger',name:'虎符坠',type:'charm',atk:4,def:2,price:180,icon:'◇',desc:'攻击 +4，防御 +2。勇者的小小护符。'},{id:'fang',name:'狼牙坠',type:'charm',atk:3,price:70,drop:true,icon:'✧',desc:'攻击 +3。清风林灰狼的獠牙，战利品。'},{id:'scarf',name:'赤巾',type:'charm',def:2,hp:12,price:80,drop:true,icon:'✧',desc:'防御 +2，最大气血 +12。山道匪徒的头巾，战利品。'},{id:'tally',name:'哨卫铁令',type:'charm',atk:2,def:3,price:120,drop:true,icon:'✧',desc:'攻击 +2，防御 +3。黑风岭的通行令，战利品。'},{id:'fur',name:'寨主狼裘',type:'charm',atk:4,def:4,hp:20,price:200,drop:true,icon:'✧',desc:'攻击 +4，防御 +4，最大气血 +20。寨主的狼裘，战利品。'},{id:'headband',name:'青布头巾',type:'head',def:1,hp:6,price:35,icon:'◎',desc:'防御 +1，最大气血 +6。挡得住山风，也挡得住汗水。'},{id:'jadecrown',name:'束发玉冠',type:'head',def:2,hp:15,price:110,icon:'◎',desc:'防御 +2，最大气血 +15。玉冠端正，心神也端正。'},{id:'ironbrow',name:'玄铁护额',type:'head',def:3,hp:25,price:220,icon:'◎',desc:'防御 +3，最大气血 +25。护住要害，敢迎刀锋。'},{id:'redcord',name:'红绳手环',type:'wrist',atk:1,hp:5,price:30,icon:'○',desc:'攻击 +1，最大气血 +5。渡口阿婆编的平安绳。'},{id:'bracer',name:'铜护腕',type:'wrist',atk:3,def:1,price:100,icon:'○',desc:'攻击 +3，防御 +1。腕力更稳，出剑更沉。'},{id:'dragonring',name:'龙纹臂环',type:'wrist',atk:5,def:1,price:230,icon:'○',desc:'攻击 +5，防御 +1。龙纹盘绕，一臂千钧。'},{id:'clothshoe',name:'千层布靴',type:'boots',def:1,hp:8,price:40,icon:'▱',desc:'防御 +1，最大气血 +8。千针万线，走得了远路。'},{id:'cloudboot',name:'踏云靴',type:'boots',def:2,hp:15,price:120,icon:'▱',desc:'防御 +2，最大气血 +15。步履轻盈，如踏云端。'},{id:'windboot',name:'追风靴',type:'boots',atk:2,def:3,hp:20,price:240,icon:'▱',desc:'攻击 +2，防御 +3，最大气血 +20。快人一步，便胜一招。'},{id:'potion',name:'回春散',type:'consumable',price:18,icon:'✦',desc:'恢复 40 气血。战斗使用会占一回合。'}];
const findItem=id=>ITEMS.find(x=>x.id===id);
const GEAR_TYPES=['weapon','armor','head','wrist','boots','charm'],OPTIONAL_GEAR=['head','wrist','boots','charm'];
const MARTIAL=[
{id:'polang',name:'破浪式',type:'move',source:'随身剑谱 · 开局已会',unlock:s=>true,cost:0,qi:2},
{id:'huifeng',name:'回风剑',type:'move',source:'竹林听剑后解锁；也可胜战 3 场或第 8 日起研习',unlock:s=>s.seen.includes('bamboo')||s.kills>=3||s.day>=8,cost:0,qi:3},
{id:'songtao',name:'松涛掌',type:'move',source:'缺页剑谱心得或等级 2 · 集市购谱另需 40 文',unlock:s=>s.seen.includes('sword')||s.level>=2,cost:40,qi:1},
{id:'changchun',name:'长春功',type:'inner',source:'温泉调息心得，或习武 1 次',unlock:s=>s.seen.includes('spring')||s.trained>=1,cost:0},
{id:'tieshan',name:'铁衫功',type:'inner',source:'铁匠炉火心得或等级 3 · 购谱另需 55 文',unlock:s=>s.seen.includes('forge')||s.level>=3,cost:55},
{id:'zhouliu',name:'周流诀',type:'inner',source:'听雨残卷 · 第 12 日或等级 5',unlock:s=>s.day>=12||s.level>=5,cost:0},
{id:'qingfeng',name:'清风步',type:'light',source:'山路步法 · 胜战 1 场',unlock:s=>s.kills>=1,cost:0},
{id:'yanshui',name:'燕回身',type:'light',source:'渡舟心得 · 第 5 日或习武 4 次',unlock:s=>s.day>=5||s.trained>=4,cost:0},
{id:'liuying',name:'掠影步',type:'light',source:'游侠步谱 · 等级 4 · 另需 45 文',unlock:s=>s.level>=4,cost:45}
];
const MARTIAL_TYPES={move:'招式',inner:'内功',light:'身法'};
function martialFresh(){return {ranks:{polang:1},slots:{move:'polang',inner:null,light:null}}}
function martialFind(id){return MARTIAL.find(m=>m.id===id)}
function martialBudget(s=S){return 3+s.trained+s.kills+2*(s.level-1)}
function martialSpent(s=S){return Object.entries(s.martial.ranks).reduce((n,[id,r])=>n+(id==='polang'?0:2)+(r>=2?3:0)+(r>=3?5:0),0)}
function martialPoints(s=S){return martialBudget(s)-martialSpent(s)}
function martialRank(id,s=S){return s.martial?.ranks?.[id]||0}
function martialActive(s=S){return martialFind(s.martial.slots.move)}
function martialDesc(id,r=1){const desc={polang:`消耗 2 真气：${Math.round((1.65+.15*(r-1))*100)}% 攻击，敌防御仅计 35%；无视敌方抱元。`,huifeng:`消耗 3 真气：${120+10*(r-1)}% 攻击，敌防御全计；命中恢复最多 ${3*r} 气血。受敌方抱元减半。`,songtao:`消耗 1 真气：${105+10*(r-1)}% 攻击，敌防御全计；本回合减伤 50%。受敌方抱元减半。`,changchun:`气血上限 +${12*r}。换装、升重不直接回血。`,tieshan:`防御 +${2*r}，持续抵挡普通与重击。`,zhouliu:`每第 ${4-r} 回合，普攻或招架额外回复 1 真气；真气上限仍为 4。`,qingfeng:`每次受击额外减伤 ${r}（在招架减伤之后计算，至少承受 1）。`,yanshui:`招架或松涛掌护身时，额外减伤 ${2*r}（至少承受 1）。`,liuying:`每场战斗首回合，攻击 +${3*r}；先手普攻与招式均生效。`};return desc[id]}
function martialSummary(s=S){return Object.entries(MARTIAL_TYPES).map(([type,label])=>{const id=s.martial.slots[type];return label+'：'+(id?martialFind(id).name+' · '+martialRank(id,s)+' 重':'未运用')}).join('<br>')}
let bagView='gear';
let gearSlot='weapon',martialSlot='move';
const GEAR_SLOTS={weapon:'兵刃',armor:'衣甲',head:'头饰',wrist:'手环',boots:'靴子',charm:'佩饰'},MARTIAL_GLYPH={move:'招',inner:'功',light:'身'};
function itemIcon(id){const src=ICONS[id];return src?`<img src="${artURL(src)}" alt="" decoding="async">`:`<span>${findItem(id)?.icon||'◇'}</span>`}
function itemStats(i){return [i.atk?'攻击 +'+i.atk:'',i.def?'防御 +'+i.def:'',i.hp?'气血 +'+i.hp:''].filter(Boolean).join(' · ')||'—'}
function setBagView(view){if(battleBusy||S.battle)return;bagView=['items','gear','martial'].includes(view)?view:'gear';render()}
function openMartial(){if(battleBusy||S.battle){toast('交锋期间不能修习或更换功法。');return}closeModal();bagView='martial';switchTab('bag')}
function openGear(slot){if(battleBusy||S.battle)return;if(GEAR_SLOTS[slot])gearSlot=slot;bagView='gear';render()}
function pickGearSlot(t){if(GEAR_SLOTS[t]){gearSlot=t;render()}}
function pickMartialSlot(t){if(MARTIAL_TYPES[t]){martialSlot=t;render()}}
function unequipGear(t){if(battleBusy||S.battle||!OPTIONAL_GEAR.includes(t)||!S.gear[t])return;const n=findItem(S.gear[t]).name;S.gear[t]=null;S.hp=Math.min(S.hp,stats().hp);render();toast('已卸下'+n)}
function bagTabs(){return `<div class="bag-tabs" role="tablist">${[['items','背包',S.inventory.length+(S.potions?1:0)+' 件'],['gear','装备',''],['martial','武学',martialPoints()+' 点']].map(([id,label,n])=>`<button role="tab" aria-selected="${bagView===id}" class="${bagView===id?'on':''}" onclick="setBagView('${id}')">${label}${n?`<small>${n}</small>`:''}</button>`).join('')}</div>`}
function slotBtn(on,fn,icon,label,name,sub){return `<button class="slot ${on?'on':''}" onclick="${fn}" aria-pressed="${on}"><span class="slot-icon">${icon}</span><span class="slot-copy"><small>${label}</small><strong>${name}</strong><em>${sub}</em></span></button>`}
function dollHTML(left,right,foot=''){return `<div class="doll"><div class="doll-col">${left}</div><div class="doll-figure">${heroSVG()}</div><div class="doll-col">${right}</div>${foot?`<div class="doll-foot">${foot}</div>`:''}</div>`}
function gearSlotBtn(t){const id=S.gear[t],i=id&&findItem(id);return slotBtn(gearSlot===t,`pickGearSlot('${t}')`,i?itemIcon(id):'<span class="slot-empty">＋</span>',GEAR_SLOTS[t],i?i.name:'未佩戴',i?itemStats(i):'点击挑选')}
function diffChips(id){const i=findItem(id),cur=stats(),n=stats({...S,gear:{...S.gear,[i.type]:id}});return [['攻击',n.atk-cur.atk],['防御',n.def-cur.def],['气血上限',n.hp-cur.hp]].filter(x=>x[1]).map(([k,v])=>`<span class="diff ${v>0?'up':'down'}">${k} ${v>0?'+':''}${v} ${v>0?'▲':'▼'}</span>`).join('')||'<span class="diff">属性不变</span>'}
function renderGear(){const st=stats(),cur=S.gear[gearSlot],list=S.inventory.filter(id=>findItem(id).type===gearSlot).sort((a,b)=>(b===cur)-(a===cur)||findItem(b).price-findItem(a).price);
return `${dollHTML(gearSlotBtn('head')+gearSlotBtn('armor')+gearSlotBtn('boots'),gearSlotBtn('weapon')+gearSlotBtn('wrist')+gearSlotBtn('charm'),`<div class="doll-stats"><span>攻击<b>${st.atk}</b></span><span>防御<b>${st.def}</b></span><span>气血<b>${S.hp}/${st.hp}</b></span></div>`)}<h3 class="pick-title">更换${GEAR_SLOTS[gearSlot]} <span class="tag">${list.length} 件可选</span></h3><div class="pick-list">${list.map(id=>{const i=findItem(id),on=cur===id;return `<div class="pick ${on?'on':''}"><span class="pick-icon">${itemIcon(id)}</span><div class="pick-copy"><strong>${i.name}${i.drop?' <span class="tag">战利品</span>':''}</strong><small>${itemStats(i)}</small><div>${on?'<span class="diff">当前佩戴</span>':diffChips(id)}</div></div>${on?(OPTIONAL_GEAR.includes(gearSlot)?`<button class="ghost" onclick="unequipGear('${gearSlot}')">卸下</button>`:'<button disabled>佩戴中</button>'):`<button class="primary" onclick="equip('${id}')">换上</button>`}</div>`}).join('')||`<p class="empty">行囊里还没有${GEAR_SLOTS[gearSlot]}。</p>`}</div><div class="chiprow"><button class="ghost" onclick="switchTab('shop')">去青石集市添置 →</button></div>`}
function martialSeal(m){return `<span class="seal-icon type-${m.type}">${m.name[0]}</span>`}
function martialSlotBtn(t){const id=S.martial.slots[t],m=id&&martialFind(id);return slotBtn(martialSlot===t,`pickMartialSlot('${t}')`,m?martialSeal(m):`<span class="slot-empty">${MARTIAL_GLYPH[t]}</span>`,MARTIAL_TYPES[t],m?m.name:'未运用',m?martialRank(id)+' 重':'点击挑选')}
function renderMartialView(){const t=martialSlot,cur=S.martial.slots[t];
return `${dollHTML(martialSlotBtn('move')+martialSlotBtn('inner'),martialSlotBtn('light')+`<div class="doll-stats"><span>可用<b>${martialPoints()}</b></span><span>累计<b>${martialBudget()}</b></span><span>已用<b>${martialSpent()}</b></span></div>`)}<p class="note">武学点：习武、胜战各 +1，升级 +2。学习 2 点、二重 3 点、三重 5 点，购谱铜钱只在首次学习时支付。每类只运用一门，交锋中锁定。</p><h3 class="pick-title">${MARTIAL_TYPES[t]} · ${t==='move'?'主动出招':t==='inner'?'根基取舍':'进退之道'}</h3><div class="pick-list">${MARTIAL.filter(m=>m.type===t).map(m=>{const r=martialRank(m.id),on=cur===m.id,cost=r===0?2:r===1?3:5,can=m.unlock(S),canStudy=r<3&&martialPoints()>=cost&&(r||(can&&S.gold>=m.cost));
return `<div class="pick ${on?'on':''} ${!r&&!can?'locked':''}"><span class="pick-icon">${martialSeal(m)}</span><div class="pick-copy"><strong>${m.name} <span class="tag">${r?r+' / 3 重':can?'可学习':'未解锁'}</span>${on?' <span class="tag">运用中</span>':''}</strong><small>${martialDesc(m.id,r||1)}</small>${r&&r<3?`<small class="next">下一重：${martialDesc(m.id,r+1)}</small>`:''}${r?'':`<small class="next">${m.source}${can?'':' · 条件未达'}</small>`}</div><div class="pick-actions">${r<3?`<button onclick="studyMartial('${m.id}')" ${canStudy?'':'disabled'}>${r?'升至 '+(r+1)+' 重':'学习'} · ${cost} 点${!r&&m.cost?' + '+m.cost+' 文':''}</button>`:'<span class="tag">三重圆满</span>'}${r&&!on?`<button class="primary" onclick="equipMartial('${m.id}')">运用</button>`:''}${on&&t!=='move'?`<button class="ghost" onclick="unequipMartial('${t}')">暂停运用</button>`:''}</div></div>`}).join('')}</div>`}
function renderItems(){const order=GEAR_TYPES,inv=[...S.inventory].sort((a,b)=>order.indexOf(findItem(a).type)-order.indexOf(findItem(b).type)),full=S.hp>=stats().hp;

function validateMartial(s){const m=s.martial;if(!m||typeof m!=='object'||Array.isArray(m)||!m.ranks||!m.slots||typeof m.ranks!=='object'||typeof m.slots!=='object'||Array.isArray(m.ranks)||Array.isArray(m.slots))throw Error('功法数据损坏');if(Object.keys(m).some(k=>!['ranks','slots'].includes(k))||Object.keys(m.slots).length!==3||Object.keys(m.slots).some(k=>!Object.hasOwn(MARTIAL_TYPES,k)))throw Error('功法栏损坏');for(const [id,r] of Object.entries(m.ranks)){const art=martialFind(id);if(!art||!Number.isInteger(r)||r<1||r>3||!art.unlock(s))throw Error('功法重数或修习条件异常')}if(!m.ranks.polang)throw Error('基础剑谱缺失');for(const [type,id] of Object.entries(m.slots)){if(id===null&&type!=='move')continue;const art=martialFind(id);if(!art||art.type!==type||!Object.hasOwn(m.ranks,id))throw Error('功法运用数据损坏')}if(martialPoints(s)<0)throw Error('武学点支出超出所得')}

function omen(s=S){let h=(s.omenSeed^Math.imul(s.day,2654435761))>>>0;h=Math.imul(h^(h>>>15),2246822507)>>>0;h=(h^(h>>>13))>>>0;return OMENS[h%OMENS.length]}
function omenHTML(){const o=omen();return `<div class="omen-card"><span>今日黄历</span><b>${o.name}</b><small>${o.desc}</small></div>`}
function omenLine(ids){const o=omen();return ids.includes(o.id)?`<p class="omen-line">今日黄历「${o.name}」：${o.desc}</p>`:''}
function omenBattleNote(){const o=omen();return o.id==='fierce'?'<br><span class="focus-tag">忌刀兵：敌方攻击 +15%，胜战阅历 +50%</span>':o.id==='star'?'<br><span class="focus-tag">吉星高照：会心一击几率 +15%</span>':''}
const DROPS={wolf:{item:'fang',rate:.15},bandit:{item:'scarf',rate:.14},elite:{item:'tally',rate:.18},boss:{item:'fur',rate:1}},DROP_IDS=Object.values(DROPS).map(d=>d.item);

function header(){const st=stats();$('day').innerHTML=(S.ended?'续章 · ':'初行 · ')+'第 <b>'+String(S.day).padStart(2,'0')+'</b> 日'+(S.ended?'':' / 三十日')+' <span class="omen-chip" title="'+omen().desc+'">'+omen().name+'</span>';syncSfx();$('portrait').innerHTML=heroSVG()+'<div class="hero-title">且以此身试江湖</div><div class="hero-level"><strong>'+S.level+'</strong>等级</div>';$('hero').innerHTML=`<div class="hero-heading"><div class="serif name">${titleChip()}无名少侠</div><div class="rank">${S.level<3?'初入江湖':S.level<6?'小有所成':S.level<9?'锋芒初现':'一方侠客'} · Lv.${S.level}</div></div><div><div class="meter-label"><span>气血</span><span id="heroHealth">${S.hp} / ${st.hp}</span></div><div class="bar hp"><i id="heroHealthBar" style="width:${S.hp/st.hp*100}%"></i></div></div><div><div class="meter-label"><span>阅历</span><span>${S.xp} / ${xpNeed()}</span></div><div class="bar xp"><i style="width:${S.xp/xpNeed()*100}%"></i></div></div><div class="statgrid"><div><span>攻击</span><b>${st.atk}</b></div><div><span>防御</span><b>${st.def}</b></div><div><span>铜钱</span><b>${S.gold}<small style="font-size:10px"> 文</small></b></div><div><span>行动</span><b>${'●'.repeat(S.energy)}${'○'.repeat(3-S.energy)}</b></div></div><div class="statline"><span>仁心 ${S.karma}</span><span>声望 ${S.fame}</span><span>心悟 ${S.insight}</span></div><div class="gear">${martialSummary()}<br><button style="margin:8px 0" onclick="openMartial()" ${S.battle?'disabled':''}>修习功法 · ${martialPoints()} 点</button><br>兵刃 <span class="tag">${findItem(S.gear.weapon).name}</span><br>衣甲 <span class="tag">${findItem(S.gear.armor).name}</span>${['head','wrist','boots','charm'].map(t=>`<br>${GEAR_SLOTS[t]} <span class="tag">${S.gear[t]?findItem(S.gear[t]).name:'尚未佩戴'}</span>`).join('')}</div>`;$('relations').innerHTML=[['lin','林知夏','一盏渡口灯','守渡线 · 好感 30 开启并肩结局'],['shen','沈砚','一封未寄信','听雨线 · 好感 30 开启破局同行'],['gu','顾铁衣','一炉不灭火','锻造线 · 好感 30 获赠上品装备']].map(([k,n,t,desc])=>`<div class="rel"><div class="npc-avatar"><img src="${artURL(ART[k])}" alt="" decoding="async"></div><div class="rel-top"><span>${n} <span class="tiny">${t}</span></span><span>${S.bond[k]}</span></div><div class="bar"><i style="width:${S.bond[k]}%"></i></div><p>${desc}</p></div>`).join('');$('journal').innerHTML=S.logs.slice(0,16).map(l=>`<div class="log"><small>第 ${l.day} 日</small>${l.text}</div>`).join('');$('seasonNote').textContent=S.ended?'这一卷已写完，你仍可自由修行、战斗与结交。存档中保留了三十日的结局。':'每一次选择都会留下回声。第三十日歇息时，以你的实力、仁心、人缘与抉择，写下不同的结局。'}
function restoreControlFocus(action){if(!action)return;const same=Array.from(document.querySelectorAll('button:not(:disabled)')).find(b=>b.getAttribute('onclick')===action);if(same)same.focus();else $('content').focus?.({preventScroll:true})}
function render(){frameEpoch++;checkTitles();const focusAction=!$('overlay').innerHTML?document.activeElement?.getAttribute?.('onclick'):null;header();renderMobileHUD();renderScenery();document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===S.tab);b.setAttribute?.('aria-current',b.dataset.tab===S.tab?'page':'false')});renderActions();if(S.battle)renderBattle();else ({encounter:renderEvent,journey:renderJourney,shop:renderShop,bag:renderBag,quests:renderQuests}[S.tab]||renderEvent)();if(activeSheet)refreshSheet();if(focusAction&&!battleBusy)restoreControlFocus(focusAction);if(battleBusy)$('content').querySelectorAll('.battle-actions button:not(:disabled)').forEach(b=>{b.disabled=true;b.setAttribute('data-was-enabled','')});save()}
function switchTab(tab){if(battleBusy)return;if(S.battle){toast('交锋尚未结束，请先完成战斗或撤退。');return}S.tab=tab;render();if(typeof matchMedia==='function'&&matchMedia('(max-width:760px), (max-width:950px) and (orientation:landscape) and (max-height:520px)').matches)$('content').scrollIntoView?.({block:'start',behavior:'smooth'})}
function renderActions(){$('actions').innerHTML=`${omenHTML()}<div class="quick"><button class="action" onclick="train()" ${S.energy<1||S.battle?'disabled':''}><strong>↗ 习武</strong><small>1 行动 · 经验 +${omen().id==='train'?33:22} · 武学点 +1<br>每修行 3 次，攻击 +1</small></button><button class="action" onclick="rest()" ${S.energy<1||S.battle||S.hp>=stats().hp?'disabled':''}><strong>♧ 调息</strong><small>1 行动 · 气血 +${omen().id==='rest'?70:35}<br>静心养伤，不耗铜钱</small></button><button class="action" onclick="work()" ${S.energy<1||S.battle?'disabled':''}><strong>▧ 帮工</strong><small>1 行动 · 铜钱 +${omen().id==='work'?33:22}<br>脚踏实地，积攒盘缠</small></button><button class="action" onclick="usePotion()" ${S.potions<1||S.battle||S.hp>=stats().hp?'disabled':''}><strong>✦ 用药 ×${S.potions}</strong><small>不耗行动 · 气血 +40<br>战斗中需占一回合</small></button></div><button class="end-day primary" onclick="askSleep()" ${S.battle?'disabled':''}>${S.day===30&&!S.ended?'今夜落笔 · 查看结局':'歇息一夜 · 前往明日'} →</button><p class="note" style="font-size:10px;margin:9px 0 0;text-align:center">每夜恢复 30 气血与全部行动 · 无时限</p>`}
const MARTIAL_EVENTS={bamboo:['huifeng'],sword:['songtao'],spring:['changchun'],forge:['tieshan'],shenSecret:['zhouliu'],bridge:['yanshui']};
function martialEventNote(e){const ids=MARTIAL_EVENTS[e.id]||[];if(!ids.length)return '';return `<div class="result" style="margin-top:16px"><h3>武学机缘 · ${ids.map(id=>martialFind(id).name).join('、')}</h3><p class="note">${S.eventDone?'已解锁研习资格，可前往行囊 → 功法学习。':'完成今日奇遇后可解锁研习资格；若已满足其他条件，也可提前学习。'}学习需 2 武学点${ids.some(id=>martialFind(id).cost)?'，另按功法页标价支付购谱铜钱':''}，不会自动扣费。</p><button onclick="openMartial()">查看功法 →</button></div>`}
function renderEvent(){const e=currentEvent();let body;if(S.eventDone){body=`<div class="result"><h3>${S.eventResult?.label||'今日的选择已落定'}</h3>${S.eventResult?.text||'今天的故事已经写入手记。'}</div><div class="note">今日奇遇不消耗行动。余下的时光，去修行、探路，或攒钱添置一件趁手的装备。</div><div class="chiprow"><button onclick="switchTab('journey')">去历练 →</button><button onclick="switchTab('shop')">逛集市 →</button>${S.ended?'<button onclick="showEnding()">重读本卷结局</button>':''}</div>`}else{body=`<p class="event-text">${e.text}</p><div class="choices">${e.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})" ${c.req&&!c.req(S)?'disabled':''}><span><strong><span class="key-hint">${i+1}</span>${c.label}</strong><small>${c.cost}${c.req&&!c.req(S)?' · 条件不足':''}</small></span><span class="arrow">↗</span></button>`).join('')}</div>`}$('content').innerHTML=`<div class="content-head"><div><div class="section-label">${e.place}</div><h2>${e.title}</h2></div><div class="event-number">${String(S.day).padStart(2,'0')}</div></div>${body}${martialEventNote(e)}`}
function choose(i){if(battleBusy)return;if(S.battle||S.eventDone)return;const e=currentEvent(),c=e.choices[i];if(!c||(c.req&&!c.req(S)))return;apply(c.effect);S.eventDone=true;S.eventResult={label:c.label,text:c.result};S.seen.push(e.id);for(const id of MARTIAL_EVENTS[e.id]||[]){if(!martialRank(id))log('武学机缘：'+martialFind(id).name+'已解锁，可在行囊 → 功法学习。')}log('「'+e.title+'」你选择了'+c.label+'。');render();sfx('page');toast('这一笔，江湖记下了。')}
function train(){if(battleBusy)return;if(S.energy<1||S.battle)return;const tx=omen().id==='train'?33:22;S.energy--;S.trained++;gainXP(tx);if(S.trained%3===0){S.atk++;log('反复打磨基本功，攻击永久 +1。')}log('习武一时，获得 '+tx+' 阅历。');render();sfx('read');toast('习武完成 · 阅历 +'+tx+' · 武学点 +1')}
function rest(){if(battleBusy)return;if(S.energy<1||S.battle||S.hp>=stats().hp)return;S.energy--;const n=Math.min(omen().id==='rest'?70:35,stats().hp-S.hp);S.hp+=n;log('静坐调息，恢复 '+n+' 气血。');render();sfx('heal');toast('调息完成 · 气血 +'+n)}
function work(){if(battleBusy)return;if(S.energy<1||S.battle)return;S.energy--;const g=omen().id==='work'?33:22;S.gold+=g;log('在渡口搬货，挣得 '+g+' 文。');render();sfx('coin');toast('帮工完成 · 铜钱 +'+g)}
function usePotion(){if(battleBusy)return;if(S.potions<1||S.battle||S.hp>=stats().hp)return;const healed=Math.min(40,stats().hp-S.hp);S.potions--;S.hp+=healed;render();sfx('heal');toast('使用回春散 · 气血 +'+healed)}
function askSleep(){if(battleBusy)return;if(S.battle)return;if(!S.eventDone){toast('今日还有未作出的选择，先看看奇遇吧。');S.tab='encounter';render();return}modal('山灯将尽',`<p>${S.energy>0?'你还剩 '+S.energy+' 点行动，歇息后不会累积。':''}一夜休息将恢复 30 气血，明日行动回满。${S.day===30&&!S.ended?'今晚会写下本卷结局，之后可以继续自由游历。':''}</p>`,[{text:'再走走',fn:'closeModal()'},{text:S.day===30&&!S.ended?'写下这一卷':'歇息至明日',fn:'sleep()',primary:true}])}

function startBattle(id){if(battleBusy)return;importEpoch++;window.pendingImport=null;if(S.battle||S.energy<1||!Object.prototype.hasOwnProperty.call(ENEMIES,id)||(id==='boss'&&S.day<20))return;const e=ENEMIES[id];S.energy--;S.battle={id,hp:e.hp,maxHp:e.hp,turn:0,qi:2,logs:['你与'+e.name+'拉开架势。'+martialActive().name+'消耗 '+martialActive().qi+' 真气，普攻与招架各回复 1 真气。']};render()}
function intent(b=S.battle){return ENEMIES[b.id].pattern[b.turn%ENEMIES[b.id].pattern.length]}
function renderBattle(){const frame=++frameEpoch,fx=battleFX;battleFX=null;const b=S.battle,e=ENEMIES[b.id],it=fx?.intent||intent(),text={quick:'试探 · 下一招普通攻击。',heavy:'蓄势 · 下一招重击，伤害约 1.7 倍！招架可减伤 75%，并「看破」：真气 +1，下一击 +30%。',guard:'抱元 · 本回合敌人防御，普攻、回风剑、松涛掌伤害减半；破浪式无视此效果。',rest:'喘息 · 本回合敌人不会攻击。此时出手为「乘隙」，伤害 +25%。'}[it];$('content').innerHTML=`<div class="content-head"><div><div class="section-label">READ THE WIND, THEN STRIKE</div><h2>${e.name}</h2></div><span class="tag">第 ${fx?fx.round:b.turn+1} 回合</span></div><div class="enemy-header"><span>敌方气血</span><span id="enemyHealth">${fx?fx.enemyBefore:b.hp} / ${b.maxHp}</span></div><div class="bar hp" style="margin-bottom:14px"><i id="enemyHealthBar" style="width:${(fx?fx.enemyBefore:b.hp)/b.maxHp*100}%"></i></div><div style="background-image:url(${stageURL(b.id)})" class="battle-field staged enemy-${b.id} intent-${it} ${fx?'fx-'+fx.type:''}${fx?.crit?' crit-hit':''} ${fx?.taken?'enemy-strikes':''}">${heroSVG().replace('<svg','<svg class="player-fighter"')}<span class="versus">対</span>${heroSVG(true,b.id).replace('<svg','<svg class="enemy-fighter"')}${fx?`<span class="battle-number player-num">${fx.taken?'−'+fx.taken:fx.type==='guard'?'守':''}</span>${fx.healed?`<span class="battle-number player-heal">+${fx.healed}</span>`:''}<span class="battle-number enemy-num${fx.crit?' crit':''}">${fx.dealt?'−'+fx.dealt:''}${fx.crit?'<small>会心</small>':''}</span>${fx.read?`<span class="read-badge">${fx.read}</span>`:''}${fx.type==='guard'?'<span class="guard-ring"></span>':''}`:''}</div><div class="intent">${fx?'◈ 正在交锋 · 本回合：':'◈ 敌方意图：'}${fx?text.replace('下一招','正在').replace('本回合','此刻'):text}<br>你：气血 <span id="playerHealth">${fx?fx.heroBefore:S.hp}</span>/${stats().hp} · 真气 ${b.qi}/4${b.focus?' · <span class="focus-tag">蓄锋待发 +30%</span>':''}</div><p class="note">${martialSummary()}${omenBattleNote()}<br>${martialDesc(martialActive().id,martialRank(martialActive().id))}${stats().regenEvery?'<br>周流回气：每第 '+stats().regenEvery+' 回合，普攻 / 招架额外 +1 真气。':''}${stats().opening&&b.turn===0?'<br>掠影先手：本回合攻击 +'+stats().opening:''}</p><div class="battle-actions"><button onclick="battleAction('attack')"><span class="key-hint">1</span>挥剑 · 真气 +1</button><button class="primary" onclick="battleAction('guard')"><span class="key-hint">2</span>招架 · 减伤 75%</button><button class="red" onclick="battleAction('skill')" ${b.qi<martialActive().qi?'disabled':''}><span class="key-hint">3</span>${martialActive().name} ${martialRank(martialActive().id)}重 · 真气 -${martialActive().qi}</button><button onclick="battleAction('potion')" ${S.potions<1||S.hp>=stats().hp?'disabled':''}><span class="key-hint">4</span>回春散 ×${S.potions} · +40</button><button onclick="battleAction('flee')"><span class="key-hint">5</span>撤退 · 损失至多 5 文</button></div><div id="battleLog" class="battle-log" aria-live="polite">${(fx?b.logs.slice(0,fx.logStart):b.logs).slice(-5).join('<br>')}</div>`;if(fx){const finalEnemy=b.hp,finalHero=S.hp,enemyMax=b.maxHp,finalLogs=b.logs.slice(-5).join('<br>');showHeroHealth(fx.heroBefore);const impact=(delay,fn)=>setTimeout(()=>{if(frame===frameEpoch)fn()},reducedMotion()?0:delay);impact(130,()=>{if($('enemyHealth'))$('enemyHealth').textContent=finalEnemy+' / '+enemyMax;if($('enemyHealthBar'))$('enemyHealthBar').style.width=finalEnemy/enemyMax*100+'%';if(fx.healed)showHeroHealth(Math.min(stats().hp,fx.heroBefore+fx.healed))});impact(420,()=>{showHeroHealth(finalHero);if($('battleLog'))$('battleLog').innerHTML=finalLogs})}}
function battleAction(action){const b=S.battle;if(!b||battleBusy)return;const e=ENEMIES[b.id],it=intent(),st=stats(),fx={type:action,dealt:0,taken:0,healed:0,intent:it,round:b.turn+1,heroBefore:S.hp,enemyBefore:b.hp,logStart:b.logs.length};if(action==='flee'){const loss=Math.min(5,S.gold);S.gold-=loss;log('从'+e.name+'手下撤退，损失 '+loss+' 文。');S.battle=null;S.tab='journey';render();toast('平安撤退。行动不返还，可修整后再来。');return}let guarded=false,guardFactor=.25;const move=martialActive(),rank=martialRank(move.id),attack=st.atk+(b.turn===0?st.opening:0);if(action==='attack'||action==='skill'){if(action==='skill'&&b.qi<move.qi)return;let damage=Math.max(2,attack-e.def);if(action==='skill'){const mult=move.id==='polang'?1.65+.15*(rank-1):move.id==='huifeng'?1.2+.1*(rank-1):1.05+.1*(rank-1);damage=Math.max(3,Math.round(attack*mult-e.def*(move.id==='polang'?.35:1)));b.qi-=move.qi;if(move.id==='songtao'){guarded=true;guardFactor=.5}}else b.qi=Math.min(4,b.qi+1);if(it==='guard'&&(action==='attack'||move.id!=='polang'))damage=Math.max(1,Math.floor(damage*.5));{let mult=1;if(b.focus){mult+=.3;b.focus=false;fx.read='蓄锋'}if(it==='rest'){mult+=.25;fx.read='乘隙';S.feats.reads++}if(rand()<.1+(omen().id==='star'?.15:0)){mult*=1.6;fx.crit=true;S.feats.crits++}damage=Math.max(1,Math.round(damage*mult))}const actual=Math.min(b.hp,damage);b.hp=Math.max(0,b.hp-damage);fx.dealt=actual;if(action==='skill'&&move.id==='huifeng'){fx.healed=Math.min(3*rank,actual,st.hp-S.hp);S.hp+=fx.healed}b.logs.push((fx.crit?'【会心】':'')+(fx.read?'【'+fx.read+'】':'')+(action==='skill'?move.name+' · '+rank+' 重':'你挥剑出击')+'，造成 '+actual+' 点伤害'+(fx.healed?'，恢复 '+fx.healed+' 气血':'')+(action==='skill'&&move.id==='songtao'?'，护身减伤 50%':'')+'。')}else if(action==='guard'){guarded=true;b.qi=Math.min(4,b.qi+1);if(it==='heavy'){b.qi=Math.min(4,b.qi+1);b.focus=true;fx.read='看破';S.feats.reads++;b.logs.push('【看破】你看准重击收剑招架，回复 2 真气，下一击 +30%。')}else b.logs.push('你收剑招架，回复 1 真气。')}else if(action==='potion'){if(S.potions<1||S.hp>=st.hp)return;fx.healed=Math.min(40,st.hp-S.hp);S.potions--;S.hp+=fx.healed;b.logs.push('你服下回春散，恢复 '+fx.healed+' 气血。')}else return;if(st.regenEvery&&(b.turn+1)%st.regenEvery===0&&(action==='attack'||action==='guard')){const n=Math.min(1,4-b.qi);b.qi+=n;b.logs.push('周流诀运转，额外回复 '+n+' 真气。')}if(b.hp<=0){battleFX=fx;playFx(fx);renderBattle();S.kills++;if(b.id==='elite'||b.id==='boss')S.eliteKills++;if(b.id==='boss')S.flags.bossDefeated=true;const loot=winLoot(b,e);S.battle=null;S.tab='journey';battleResult('一战告捷',`<p>你击败了${e.name}。<br>获得 ${loot.xp} 阅历 · ${loot.gold} 文 · 武学点 +1${loot.html}${b.id==='boss'?'<br>黑风寨的旗倒了。你已取得平定山寨的结局资格。':''}</p>`,[{text:'收剑，继续前行',fn:'closeModal()',primary:true}]);return}if(it==='quick'||it==='heavy'){let dmg=Math.max(2,Math.round(e.atk*(it==='heavy'?1.7:1))-st.def);if(guarded)dmg=Math.max(1,Math.ceil(dmg*guardFactor)-st.guard);dmg=Math.max(1,dmg-st.reduction);S.hp=Math.max(0,S.hp-dmg);fx.taken=dmg;b.hurt=true;b.logs.push(e.name+(it==='heavy'?'重击':'出手')+'，你承受 '+dmg+' 点伤害'+(guarded?'（招架减伤）':'')+'。')}else b.logs.push(it==='rest'?'敌人正在喘息，没有出手。':'敌人固守架势，没有出手。');if(S.hp<=0){battleFX=fx;playFx(fx);renderBattle();const loss=Math.min(12,S.gold);S.gold-=loss;S.hp=Math.ceil(st.hp*.5);log('不敌'+e.name+'，被路人救回。损失 '+loss+' 文，恢复至半血。');S.battle=null;S.tab='journey';battleResult('胜败，都是来路',`<p>你被路过的镖师救回渡口。装备与阅历都还在，只损失了 ${loss} 文。气血恢复至一半。<br>试着在敌人蓄势时招架，喘息时运用招式，或先修习功法、升级装备再来。</p>`,[{text:'记下这一课',fn:'closeModal()',primary:true}]);return}b.turn++;b.logs=b.logs.slice(-20);battleFX=fx;playFx(fx);lockBattle();render()}
function showHeroHealth(hp){const max=stats().hp;for(const id of ['heroHealth','mobileHealth'])if($(id))$(id).textContent=hp+' / '+max;for(const id of ['heroHealthBar','mobileHealthBar'])if($(id))$(id).style.width=hp/max*100+'%';if($('playerHealth'))$('playerHealth').textContent=hp}

function price(i){return Math.round(i.price*(omen().id==='market'?.8:1))}function renderShop(){$('content').innerHTML=`<div class="content-head"><div><div class="section-label">QINGSHI MARKET</div><h2>青石集市</h2></div><span class="tag">盘缠 ${S.gold} 文</span></div>${omenLine(['market'])}<p class="note">明码实价，不耗行动。购买装备后须在行囊佩戴；旧装备可按原价一半出售。</p><div class="shop-grid">${ITEMS.filter(i=>i.price>0&&!i.drop).map(i=>`<div class="item"><div class="item-top"><span class="item-icon">${itemIcon(i.id)}</span><span class="tiny">${GEAR_SLOTS[i.type]||'药品'}</span></div><h3>${i.name}</h3><p>${i.desc}</p><button onclick="buy('${i.id}')" ${S.gold<price(i)||(i.type!=='consumable'&&S.inventory.includes(i.id))?'disabled':''}>${i.type!=='consumable'&&S.inventory.includes(i.id)?'已在行囊':price(i)+' 文 · 买入'}</button></div>`).join('')}</div>`}
function buy(id){if(battleBusy)return;if(S.battle)return;const i=findItem(id);if(!i||i.price<=0||i.drop||S.gold<price(i)||(i.type!=='consumable'&&S.inventory.includes(id)))return;const paid=price(i);S.gold-=paid;if(i.type==='consumable')S.potions++;else S.inventory.push(id);log('在青石集市购得'+i.name+'，花费 '+paid+' 文。');render();sfx('coin');toast(i.name+'已入行囊'+(i.type==='consumable'?'':' · 记得佩戴'))}
function equip(id){if(battleBusy)return;if(S.battle||!S.inventory.includes(id))return;const i=findItem(id);if(!i||i.type==='consumable')return;S.gear[i.type]=id;S.hp=Math.min(S.hp,stats().hp);render();toast('已佩戴'+i.name)}function sell(id){if(battleBusy)return;if(S.battle||!S.inventory.includes(id)||Object.values(S.gear).includes(id))return;const i=findItem(id);if(!i||!i.price)return;S.inventory=S.inventory.filter(x=>x!==id);S.gold+=Math.floor(i.price/2);render();sfx('coin');toast('已出售'+i.name+' · +'+Math.floor(i.price/2)+' 文')}

function causalLedger(){const paths=[['侠义','仁心',S.karma,'25','温柔成侠'],['机巧','心悟',S.insight,'20','证据破局'],['侠名','声望',S.fame,'20','众人同心']];const links=[['letter','为信使送信','沈砚更愿意邀你潜入取证'],['evidence','保住了黑风寨证据','第 20 日可公开真相；第 29 日心悟达 20 可无战破局'],['secretPath','记住了寨中暗道','第 26 日可接应受困者'],['linEnding','与林知夏并肩守渡','本卷结局将留下她的约定'],['shenEnding','陪沈砚离开听雨楼','本卷结局将写下同行之约'],['guEnding','接过顾铁衣的赠礼','本卷结局将记得炉火中的承诺'],['peaceVictory','联合众人结束恐惧','已获得「众人同心」结局资格'],['wisdomVictory','用证据瓦解幕后靠山','已获得「不战而明」结局资格'],['bossDefeated','亲手击败黑风寨主','已获得战胜山寨结局资格'],['bribe','收下了山寨的银钱','若未完成更高优先的结局，存款 150 文可走向「浮名与碎银」']].filter(x=>S.flags[x[0]]);return `<div class="result"><h3>你走过的路，正在改变前路</h3><div class="chiprow">${paths.map(x=>`<span class="tag">${x[0]} · ${x[1]} ${x[2]} / ${x[3]}</span>`).join('')}</div><p class="note">仁心决定你如何被人记住，心悟与证据能避开决战，声望让普通人愿意与你并肩。三位朋友好感达 30，会在各自的关键日开启专属选择。</p>${links.length?links.map(x=>`<div style="padding:9px 0;border-top:1px solid #d6d2bd;font-size:12px"><strong>${x[1]}</strong><br><span style="color:#70806e">↳ ${x[2]}</span></div>`).join(''):'<p class="note">尚未落下关键一笔。第 2 日的信使、第 12 日的密谋、第 13 日的破庙，都可能改变你的后路。</p>'}</div>`}
function renderQuests(){$('content').innerHTML=`<div class="content-head"><div><div class="section-label">SMALL DEEDS, LONG ECHOES</div><h2>因果簿与委托</h2></div></div>${causalLedger()}${titlesHTML()}<h3 style="margin-top:22px">沿途委托</h3><p class="note">目标会自动记录进度，完成后在此领取。每项奖励仅可领取一次。</p>${QUESTS.map(q=>`<div class="quest"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${q.name}</strong><span class="tag">${q.progress(S)}</span></div><p>${q.desc}<br>报酬：${q.reward}</p><button onclick="claim('${q.id}')" ${S.claimed.includes(q.id)||!q.check(S)?'disabled':''}>${S.claimed.includes(q.id)?'已领取':q.check(S)?'领取报酬':'尚未达成'}</button></div>`).join('')}`}
function claim(id){if(battleBusy)return;if(S.battle)return;const q=QUESTS.find(q=>q.id===id);if(!q||S.claimed.includes(id)||!q.check(S))return;S.claimed.push(id);apply(q.effect);log('完成委托「'+q.name+'」，领取报酬。');render();sfx('coin');toast('委托完成 · '+q.reward)}
function computeEnding(s){let title,text;if(s.flags.bossDefeated&&s.karma>=15){title='一剑春风 · 侠之初成';text='你用剑斩断了山寨的旗，也用善意接住了旗影下的人。三十日前的江湖小白，终于懂得大侠不是一个称号，而是一遍又一遍的选择。'}else if(s.flags.wisdomVictory){title='不战而明 · 落子无声';text='你没有只把目光放在寨门，而是看见门后的账册、买主与恐惧。当秘密被照亮，黑风寨便失去了立足之地。你的剑没有染血，江湖却因此改变。'}else if(s.flags.peaceVictory){title='众人同心 · 万家灯火';text='不是你一个人救了这座镇子。你让每个普通人相信，他们也有守护家园的力量。从此，渡口每一盏灯，都算你的侠名。'}else if(s.flags.bossDefeated){title='锋芒独行 · 一战成名';text='黑风寨主败在你的剑下，名字随驿路传到远方。你已证明自己的力量，至于这份力量将为何而用，仍有很长的路可以回答。'}else if(s.karma>=25){title='人间有归处 · 温柔也成侠';text='你未必拔掉了最险的山寨，却为很多人留下一条回家的路。面摊边总有你的位置，陌生人会替你添一碗茶。这也是江湖，这也是侠。'}else if(s.flags.bribe&&s.gold>=150){title='浮名与碎银 · 另一条路';text='你学会了在风浪里保存自己，也积下了不少银钱。有些朋友渐行渐远，有些门却为你打开。你已走出一条路，是否喜欢它，只有你能回答。'}else{title='山河未尽 · 少年仍在路上';text='这一卷没有惊天动地的终章。你受过伤、交过朋友、学会几招真正属于自己的剑法。远方仍在，而你已经不再是来时那个踌躇的少年。'}const companions=[];if(s.flags.linEnding)companions.push('林知夏将渡口的灯留给你：无论走多远，都有一碗热面。');if(s.flags.shenEnding)companions.push('沈砚离开听雨楼，与你同行，只传值得传的消息。');if(s.flags.guEnding)companions.push('顾铁衣的炉火为你长明，你的兵刃里有他的承诺。');return{title,text,companions,day:30,level:s.level,karma:s.karma,fame:s.fame,insight:s.insight,kills:s.kills}}
function showEnding(){const e=S.ending;if(!e)return;modal('三十日 · 一卷江湖',`<div class="ending"><img class="ending-art" src="${artURL(ART.ending)}" alt="夕照下的栖霞渡，少侠立于古桥，河灯初上"><div class="tiny" style="color:#aabda6">YOUR STORY, YOUR WAY</div><h2>${e.title}</h2><p>${e.text}</p>${e.companions.map(t=>'<p>◇ '+t+'</p>').join('')}<div class="chiprow"><span class="tag">等级 ${e.level}</span><span class="tag">仁心 ${e.karma}</span><span class="tag">声望 ${e.fame}</span><span class="tag">心悟 ${e.insight}</span><span class="tag">胜战 ${e.kills}</span><span class="tag">称号 ${S.titles.length} / ${TITLES.length}</span></div></div><p class="note">结局已随存档保存。继续游历将进入无尽续章，奇遇循环出现，不会改写本卷结局。</p>`,[{text:'继续游历',fn:'closeModal()',primary:true}])}
function modal(title,body,buttons){importEpoch++;if(title!=='替换当前旅程？')window.pendingImport=null;if(!$('overlay').innerHTML)modalReturnFocus=document.activeElement;activeSheet=null;document.body?.classList?.add('modal-open');document.querySelector('.shell')?.setAttribute('inert','');$('mobileTools').setAttribute('inert','');$('overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}" tabindex="-1"><div class="section-label">JIANGHU WEIWAN</div><h2>${title}</h2>${body}<div class="button-row">${buttons.map(b=>`<button class="${b.primary?'primary':''}" onclick="${b.fn}">${b.text}</button>`).join('')}</div></section></div>`;setTimeout(()=>$('overlay').querySelector('button')?.focus(),30)}function closeModal(){importEpoch++;window.pendingImport=null;activeSheet=null;$('overlay').innerHTML='';document.body?.classList?.remove('modal-open');document.querySelector('.shell')?.removeAttribute('inert');$('mobileTools').removeAttribute('inert');if(modalReturnFocus?.isConnected!==false)modalReturnFocus?.focus?.();else restoreControlFocus(modalReturnFocus?.getAttribute?.('onclick'));if(S.tutorial){S.tutorial=false;save()}}
function renderMobileHUD(){const st=stats();$('mobileHud').innerHTML=`<button class="hud-person" onclick="openCharacter()" aria-label="查看少侠详情、关系与手记"><span class="hud-avatar">${heroSVG()}</span><span class="hud-copy"><strong>第 ${S.day} 日 <small>${omen().name} · Lv.${S.level} ›</small></strong><small>气血 <span id="mobileHealth">${S.hp} / ${st.hp}</span></small><span class="bar hp"><i id="mobileHealthBar" style="width:${S.hp/st.hp*100}%"></i></span></span></button><div class="hud-resources"><span>行动 <strong>${'●'.repeat(S.energy)}${'○'.repeat(3-S.energy)}</strong> ${S.energy}/3</span><span>铜钱 <strong>${S.gold}</strong> 文</span></div>`;$('mobileTools').innerHTML=`<button onclick="openQuick()" ${S.battle?'disabled':''}>修行 · 调息 · 用药</button><button class="primary" onclick="askSleep()" ${S.battle?'disabled':''}>${S.day===30&&!S.ended?'今夜落笔':'歇息 · 明日'} →</button>`}
function sheetBody(type){if(type==='actions')return '<div id="sheetActions">'+$('actions').innerHTML+'</div>';const st=stats();return `<div class="sheet-head">${heroSVG()}<div><h3>${titleChip()}无名少侠 · Lv.${S.level}</h3><p class="note">气血 ${S.hp} / ${st.hp}<br>阅历 ${S.xp} / ${xpNeed()}<br>一人一剑，也能走出不同的江湖。</p></div></div><div class="sheet-stats">${[['攻击',st.atk],['防御',st.def],['铜钱',S.gold],['仁心',S.karma],['声望',S.fame],['心悟',S.insight]].map(x=>`<span>${x[0]}<b>${x[1]}</b></span>`).join('')}</div><p class="note">${martialSummary()}<br>武学点 ${martialPoints()}<br>身法：每次减伤 ${st.reduction} · 招架额外减伤 ${st.guard} · 首回合攻击 +${st.opening}</p><button onclick="openMartial()" ${S.battle?'disabled':''}>修习与运用功法 →</button><p class="note">兵刃：${findItem(S.gear.weapon).name}<br>衣甲：${findItem(S.gear.armor).name}${['head','wrist','boots','charm'].map(t=>`<br>${GEAR_SLOTS[t]}：${S.gear[t]?findItem(S.gear[t]).name:'尚未佩戴'}`).join('')}</p><details open><summary>江湖故人 · 三段相逢</summary>${$('relations').innerHTML}</details><details><summary>风物手记 · 最近行踪</summary><div class="journal">${$('journal').innerHTML}</div></details>`}
function openQuick(){modal('今日修行',sheetBody('actions'),[{text:'返回江湖',fn:'closeModal()',primary:true}]);activeSheet='actions';$('overlay').querySelector('.modal')?.classList?.add('sheet-dialog')}
function openCharacter(){modal('少侠行记',sheetBody('character'),[{text:'返回江湖',fn:'closeModal()',primary:true}]);activeSheet='character';$('overlay').querySelector('.modal')?.classList?.add('sheet-dialog')}
function refreshSheet(){if(activeSheet==='actions'&&$('sheetActions')){const focused=document.activeElement?.getAttribute?.('onclick');$('sheetActions').innerHTML=$('actions').innerHTML;if(focused){const buttons=$('sheetActions').querySelectorAll?.('button:not(:disabled)');const next=Array.from(buttons||[]).find(b=>b.getAttribute('onclick')===focused)||buttons?.[0];next?.focus?.()}}}
if(document.addEventListener)document.addEventListener('keydown',e=>{if(!$('overlay').innerHTML){if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;const n='12345'.indexOf(e.key);if(n<0)return;if(S.battle){const a=['attack','guard','skill','potion','flee'][n],btn=document.querySelector(`.battle-actions button[onclick="battleAction('${a}')"]`);if(btn&&!btn.disabled){e.preventDefault();battleAction(a)}}else if(S.tab==='encounter'&&!S.eventDone&&n<3){const btn=document.querySelectorAll('.choices .choice')[n];if(btn&&!btn.disabled){e.preventDefault();choose(n)}}return}if(e.key==='Escape'){e.preventDefault();closeModal();return}if(e.key==='Tab'){const q=$('overlay').querySelectorAll?.('button:not(:disabled), summary, [tabindex="0"]');if(!q?.length)return;const first=q[0],last=q[q.length-1];if(!Array.from(q).includes(document.activeElement)){e.preventDefault();first.focus()}else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

function openHelp(){modal('先做个江湖小白',`<p>欢迎来到栖霞渡。你有三十日，决定自己成为怎样的人。这里没有倒计时，慢慢选。</p><div class="tutorial-steps"><div><b>一</b>每天先遇见一个故事。选择旁会写明收益、代价与条件，仁心、声望与心悟将改变后续选项。</div><div><b>二</b>每天有 3 点行动：习武、帮工、调息或打一场怪。买卖装备和奇遇不耗行动；买完记得在行囊佩戴。</div><div><b>三</b>战斗先看敌方意图。蓄势时招架，喘息时出手；普攻 / 招架积攒真气，按已运用招式出招，真气消耗以招式按钮为准。行囊 → 功法可学习、升重与运用，每类运用一门；习武、胜战与升级获得专用武学点。</div><div><b>四</b>结交三位有自己故事的朋友。第 29 日可用声望或证据破局，也可在第 20 日起挑战寨主。</div><div><b>✦</b>每日黄历带来不同加成。战斗中招架重击可「看破」、趁喘息出手可「乘隙」，还有会心一击；胜战可能掉落稀有佩饰；达成目标获得江湖称号。右上角可开关音效。</div><div><b>五</b>第 30 日歇息写下结局，之后还能自由游历。自动保存只在当前浏览器；换设备请导出 JSON 存档。</div></div>`,[{text:'执剑入江湖',fn:'closeModal()',primary:true}])}
function openSave(){modal('把江湖放进行囊',`<p>进度会自动保存在当前浏览器。打开本地 HTML 时，不同浏览器的保存行为可能不同；重要旅程请另存一份 JSON 存档。导入将替换当前进度。</p><p class="note">存档包含当前回合、装备、关系与剧情进度。无账号、无网络请求。</p>`,[{text:'导出存档',fn:'exportSave()'},{text:'导入存档',fn:"document.getElementById('importFile').click()"},{text:'重新启程',fn:'askReset()'},{text:'返回江湖',fn:'closeModal()',primary:true}])}
function exportSave(){save();const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='江湖未晚-第'+S.day+'日存档.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已生成存档文件，请妥善保存。')}
function validate(s){s=JSON.parse(JSON.stringify(s));if(!s||![1,2].includes(s.v))throw Error('不是此版本的江湖存档');const legacy=s.v===1;for(const k of ['day','level','hp','baseHp','xp','atk','def','gold','energy','insight','karma','fame','potions','kills','eliteKills','trained','seed'])if(!Number.isSafeInteger(s[k]))throw Error('存档数值损坏');if(s.day<1||s.day>100000||s.level<1||s.level>10000||s.hp<1||s.baseHp<1||s.energy<0||s.energy>3||s.gold<0||s.potions<0||s.seed<=0||s.seed>=2147483647)throw Error('存档范围异常');for(const k of ['xp','atk','def','insight','kills','eliteKills','trained'])if(s[k]<0||s[k]>100000000)throw Error('存档数值范围异常');if(s.xp>=xpNeed(s)||s.eliteKills>s.kills)throw Error('存档进度异常');for(const k of ['ended','eventDone','tutorial'])if(typeof s[k]!=='boolean')throw Error('存档状态损坏');if((s.ended&&(s.day<31||!s.ending))||(!s.ended&&(s.day>30||s.ending)))throw Error('结局进度不一致');if(!s.bond||!s.gear||!s.flags||!Array.isArray(s.inventory)||!Array.isArray(s.logs)||!Array.isArray(s.claimed)||!Array.isArray(s.seen))throw Error('存档结构不完整');for(const o of [s.flags,s.gear,s.bond])if(typeof o!=='object'||Array.isArray(o))throw Error('存档对象损坏');const allowedFlags=new Set(EVENTS.flatMap(e=>e.choices.map(c=>c.effect.flag)).filter(Boolean).concat(['bossDefeated']));for(const [k,v] of Object.entries(s.flags))if(!allowedFlags.has(k)||typeof v!=='boolean')throw Error('剧情标记损坏');if(Object.keys(s.gear).some(k=>!GEAR_TYPES.includes(k)))throw Error('装备栏损坏');if(new Set(s.inventory).size!==s.inventory.length)throw Error('重复装备数据');if(s.claimed.some(id=>!QUESTS.some(q=>q.id===id))||new Set(s.claimed).size!==s.claimed.length)throw Error('委托数据损坏');if(s.seen.some(id=>!EVENTS.some(e=>e.id===id)))throw Error('奇遇记录损坏');for(const k of ['lin','shen','gu'])if(!Number.isInteger(s.bond[k])||s.bond[k]<0||s.bond[k]>100)throw Error('人物关系损坏');if(s.inventory.some(id=>!findItem(id)||findItem(id).type==='consumable'))throw Error('装备数据损坏');for(const type of GEAR_TYPES){const id=s.gear[type]??null;s.gear[type]=id;if(OPTIONAL_GEAR.includes(type)&&!id)continue;if(!s.inventory.includes(id)||findItem(id).type!==type)throw Error('佩戴数据损坏')}if(!['encounter','journey','shop','bag','quests'].includes(s.tab))s.tab='encounter';if(s.battle){const b=s.battle;if(!Object.prototype.hasOwnProperty.call(ENEMIES,b.id)||!Number.isInteger(b.hp)||b.hp<=0||b.hp>ENEMIES[b.id].hp||b.maxHp!==ENEMIES[b.id].hp||!Number.isInteger(b.turn)||b.turn<0||!Number.isInteger(b.qi)||b.qi<0||b.qi>4||!Array.isArray(b.logs))throw Error('战斗数据损坏');b.logs=b.logs.filter(x=>typeof x==='string').map(escapeHTML).slice(-20)}s.logs=s.logs.filter(l=>l&&Number.isInteger(l.day)&&typeof l.text==='string').map(l=>({day:l.day,text:escapeHTML(l.text)})).slice(0,100);if(s.eventResult){if(typeof s.eventResult.label!=='string'||typeof s.eventResult.text!=='string')throw Error('奇遇数据损坏');s.eventResult={label:escapeHTML(s.eventResult.label),text:escapeHTML(s.eventResult.text)}}if(s.ending){const e=s.ending;if(typeof e.title!=='string'||typeof e.text!=='string'||!Array.isArray(e.companions))throw Error('结局数据损坏');e.title=escapeHTML(e.title);e.text=escapeHTML(e.text);e.companions=e.companions.filter(t=>typeof t==='string').map(escapeHTML);for(const k of ['level','karma','fame','insight','kills'])if(!Number.isInteger(e[k]))throw Error('结局数据损坏')}normalizeFun(s);if(legacy){s.martial=martialFresh();s.v=2}validateMartial(s);s.hp=Math.min(s.hp,stats(s).hp);s.tutorial=false;return s}
function escapeHTML(v){return String(v).replace(/&(?!amp;|lt;|gt;|quot;|#39;)|[<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(battleBusy||S.battle){toast('请结束战斗后再导入存档。');return}const epoch=++importEpoch;if(file.size>1000000){toast('存档过大，未导入。');return}try{const text=await file.text();if(epoch!==importEpoch||battleBusy||S.battle)return;const data=validate(JSON.parse(text));window.pendingImport=data;modal('替换当前旅程？',`<p>将导入第 ${data.day} 日、等级 ${data.level} 的存档。当前进度会被覆盖，建议先导出备份。</p>`,[{text:'取消',fn:'cancelImport()'},{text:'确认导入',fn:'confirmImport()',primary:true}])}catch(err){toast('导入失败：'+err.message)}});function cancelImport(){window.pendingImport=null;closeModal()}function confirmImport(){if(battleBusy||S.battle||!window.pendingImport)return;clearTimeout(battleTimer);battleBusy=false;S=window.pendingImport;damagedSave=null;window.pendingImport=null;closeModal();render();toast('存档已导入，旅程继续。')}function askReset(){modal('真的重新启程吗？','<p>当前旅程会被清除，无法直接撤销。若想保留这段江湖，请先导出存档。</p>',[{text:'先导出存档',fn:'exportSave()'},{text:'保留当前旅程',fn:'closeModal()'},{text:'确认重新开始',fn:'resetGame()',primary:true}])}function resetGame(){if(battleBusy||S.battle)return;bagView='gear';clearTimeout(battleTimer);battleBusy=false;damagedSave=null;S=fresh();closeModal();render();openHelp()}
window.JIANGHU_TEST={MARTIAL,martialPoints,martialBudget,martialSpent,martialDesc,studyMartial,equipMartial,unequipMartial,renderMartial,fresh,stats,xpNeed,validate,computeEnding,EVENTS,ITEMS,ENEMIES,QUESTS,getState:()=>JSON.parse(JSON.stringify(S)),setState:s=>{S=validate(s);render()},choose,train,work,rest,startBattle,battleAction,buy,equip,sell,claim,sleep,intent,apply,gainXP};
try{const raw=localStorage.getItem(KEY);if(raw){damagedSave=raw;S=validate(JSON.parse(raw));damagedSave=null}}catch(e){console.warn('存档读取失败',e)}render();if(damagedSave!==null)modal('旧旅程需要修复','<p>旧存档未能读取，原始数据仍然保留，没有被新旅程覆盖。请先导出原始备份，或导入可用的存档。</p>',[{text:'备份原始存档',fn:'exportDamagedSave()'},{text:'导入备份',fn:"document.getElementById('importFile').click()"},{text:'重新启程',fn:'askReset()'}]);else if(S.tutorial)openHelp();
function exportDamagedSave(){if(damagedSave===null)return;const a=document.createElement('a'),url=URL.createObjectURL(new Blob([damagedSave],{type:'application/json'}));a.href=url;a.download='江湖未晚-待修复存档.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}

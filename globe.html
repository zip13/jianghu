<style>
  :root {
    --ink: #2a2521;
    --ink-soft: #6b6158;
    --paper: #f7f2e7;
    --orange: #e8641e;
    --bar: rgba(255, 252, 246, 0.86);
    --bar-line: rgba(42, 37, 33, 0.10);
    --shadow: 0 12px 32px rgba(60, 45, 30, 0.20), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9ccb6; color: var(--ink);
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; -webkit-font-smoothing: antialiased; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; touch-action: none; outline: none; }

  .brand { position: fixed; left: 16px; top: 14px; padding: 6px 12px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(8px); font-size: 13px;
    letter-spacing: .08em; color: var(--ink-soft); user-select: none; }

  .hint { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); padding: 9px 16px;
    border-radius: 999px; background: rgba(42, 37, 33, 0.84); color: #fff7ec; font-size: 14px;
    letter-spacing: .04em; pointer-events: none; white-space: nowrap; transition: opacity .4s, transform .4s; }
  .hint.off { opacity: 0; transform: translate(-50%, 8px); }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #d9ccb6;
    font-size: 15px; letter-spacing: .2em; color: var(--ink-soft); transition: opacity .6s; z-index: 10; }
  #loading.off { opacity: 0; pointer-events: none; }

  .tb { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center;
    gap: 2px; padding: 6px; border-radius: 16px; background: var(--bar); backdrop-filter: blur(14px);
    box-shadow: var(--shadow); transition: opacity .5s, transform .5s; max-width: calc(100vw - 32px);
    overflow-x: auto; scrollbar-width: none; user-select: none; }
  .tb.off { opacity: 0; transform: translate(-50%, 24px); pointer-events: none; }
  .tb button { height: 36px; min-width: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent;
    color: var(--ink); font: inherit; font-size: 14px; display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; cursor: pointer; white-space: nowrap; transition: background .2s, color .2s; }
  .tb button:hover { background: rgba(42, 37, 33, 0.07); }
  .tb button:disabled { opacity: .35; cursor: default; background: transparent; }
  .tb button.on { background: var(--ink); color: #fff7ec; }

  .tb .sep { width: 1px; height: 22px; background: var(--bar-line); margin: 0 6px; flex: none; }
  .tb .label { min-width: 150px; padding: 0 8px; font-size: 14px; text-align: center; white-space: nowrap; }
  .tb .label b { font-family: "Times New Roman", serif; font-weight: 400; color: var(--orange); margin-right: 6px; font-size: 16px; }
  .ab { display: flex; align-items: center; gap: 2px; padding-left: 2px; }

  .ab .k { font-family: inherit; font-style: normal; font-size: 14px; color: var(--ink-soft); white-space: nowrap; }
  .tb button.hide { display: none; }
  @media (max-width: 1280px) { .tb .txt { display: none; } .ab .k { font-size: 13px; } }

  .menu { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); min-width: 260px; padding: 8px;
    border-radius: 14px; background: var(--bar); backdrop-filter: blur(14px); box-shadow: var(--shadow);
    transition: opacity .25s, transform .25s; }
  .menu.off { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }
  .menu button { display: flex; width: 100%; align-items: baseline; gap: 10px; padding: 10px 12px; border: 0;
    background: transparent; font: inherit; font-size: 14px; color: var(--ink); border-radius: 8px; cursor: pointer; text-align: left; }
  .menu button:hover { background: rgba(42, 37, 33, 0.07); }

  @media (max-width: 640px) {

</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   尺寸与常量（场景单位 ≈ 厘米）
   ================================================================ */
const W = 10, H = 14;               // 单页宽高
const T = 0.55;                     // 单侧书页厚度
const CV = 0.12, MG = 0.28;         // 封面板厚度、封面外延
const CW = 1100, CH = 1540;         // 页面贴图像素
const PX = CW / W;                  // 每单位像素
const LIFT = 0;                     // 地球仪立在书页上，不再整体悬空
const R = 1.4;                      // 地球仪半径
const MAP_W = 2 * Math.PI * R, MAP_H = Math.PI * R;   // 世界地图在书页上的宽高：正好能卷成半径 R 的球
const ZM = -2.3;                    // 地图中心在右页上的位置（页面坐标 z）
const GS = 1.3;                     // 收成球时顺带放大，地球仪比印着的地图更显眼
const ZG = 0.4, GY = R * GS + 0.85; // 地球仪球心位置（页面坐标 z、离纸面高度）
const RH = R * 1.12;                // 地轴半长 / 支架半圆半径（地球仪自身坐标）
const TILT = THREE.MathUtils.degToRad(23.5);           // 地轴倾斜
const HOME_SPIN = THREE.MathUtils.degToRad(-105);      // 立起后让中国正对读者
const SU = 128, SV = 64;            // 地图网格细分

const C = {
  ink: '#2a2521', soft: '#5f564e', gray: '#9b9187', line: '#d8cdbb',
  orange: '#e8641e', orangeL: '#f6a35d', paper: '#f7f2e7', card: '#fbf7ee',
  hl: 'rgba(255, 158, 64, 0.30)', box: '#fbefdc', green: '#2f8f6f', blue: '#2f6fb0', gold: '#c9a45a',
};
const F_CN = '"Noto Serif SC", "Songti SC", "SimSun", serif';
const F_HAND = '"Ma Shan Zheng", "KaiTi", "STKaiti", cursive';
const F_MATH = '"Times New Roman", "Times", "Noto Serif SC", serif';

/* ================================================================
   状态
   ================================================================ */
const S = {
  opened: false, spread: 0, busy: false, playing: false,
  built: [false, false, false, false],
  step: [0, 0, 0, 0],
  view: 'read', sub: null,
  spin: false, unfold: false,       // 当前地球仪：自转 / 展开成地图
  cur: 'A',                         // 第 3 节：正在填写的点
  guess: { A: { lat: null, lon: null }, B: { lat: null, lon: null }, C: { lat: null, lon: null } },
  res: {}, checked: false,          // 第 3 节：验证结果
};

/* ================================================================
   工具：缓动、补间
   ================================================================ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  lin: t => t,
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  back: t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  bounce: t => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
    return n * (t -= 2.625 / d) * t + .984375;
  },
};
const CANCEL = Symbol('cancel');
const tweens = [];
function tween(dur, fn, ez = ease.io, ctl = null) {
  return new Promise((res, rej) => tweens.push({ t0: performance.now(), dur, fn, ez, res, rej, ctl }));
}
const wait = (ms, ctl) => tween(ms, () => {}, ease.lin, ctl);
function runTweens(now) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const t = tweens[i];
    if (t.ctl && t.ctl.cancelled) { tweens.splice(i, 1); t.rej(CANCEL); continue; }
    const p = Math.min(1, (now - t.t0) / t.dur);
    t.fn(t.ez(p));
    if (p >= 1) { tweens.splice(i, 1); t.res(); }
  }
}

/* ================================================================
   排版引擎：中文 + 数学混排（斜体字母、分数、高亮）
   语法：{b:粗体} {o:橙色} {g:灰色} {w:白色}  ⟦分子¦分母⟧  \n 换行
   ================================================================ */
const USED = new Set();
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const OPS = '=+−×÷<>≤≥↔';
const NO_START = '，。、；：！？）》”,.;:!?)';

function tokenize(str) {
  USED.add(str);
  const toks = [], st = [];
  const cur = () => ({ bold: st.includes('b'), col: [...st].reverse().map(k => ({ o: C.orange, g: C.gray, w: '#fff', t: C.green })[k]).find(Boolean) || null });
  let i = 0;
  while (i < str.length) {
    const c = str[i];
    if (c === '{' && str[i + 2] === ':') { st.push(str[i + 1]); i += 3; continue; }
    if (c === '}' && st.length) { st.pop(); i++; continue; }
    if (c === '\n') { toks.push({ t: 'nl' }); i++; continue; }
    if (c === '⟦') {
      const j = str.indexOf('⟧', i); const [num, den] = str.slice(i + 1, j).split('¦');
      toks.push({ t: 'frac', num, den, ...cur() }); i = j + 1; continue;
    }
    const prev = [...toks].reverse().find(t => t.t !== 'sp');
    const unary = c === '−' && /[0-9]/.test(str[i + 1] || '') &&
      (!prev || (prev.t === 'text' && !/[A-Za-z0-9)|]$/.test(prev.s)));
    if (/[A-Za-z0-9.]/.test(c) || unary) {
      let j = i + 1; const re = /[A-Za-z]/.test(c) ? /[A-Za-z]/ : /[0-9.]/;
      while (j < str.length && re.test(str[j])) j++;
      toks.push({ t: 'text', s: str.slice(i, j), ...cur() }); i = j; continue;
    }
    if (c === ' ') { toks.push({ t: 'sp', s: ' ' }); i++; continue; }
    toks.push({ t: 'text', s: c, ...cur() }); i++;
  }
  return toks;
}
function tokFont(t, size) {
  const b = t.bold ? 'bold ' : '';
  // 地理书里的字母都是方位、点名（N、S、E、W、A…），用正体
  if (/^[A-Za-z]+$/.test(t.s)) return `${b}${Math.round(size * 1.08)}px ${F_MATH}`;
  if (/^[−0-9.]+$/.test(t.s) || /^[+−=()|÷×<>\/:%≤≥°]$/.test(t.s)) return `${b}${Math.round(size * 1.08)}px ${F_MATH}`;
  return `${t.bold ? 700 : 400} ${size}px ${F_CN}`;
}
function inlineW(ctx, str, size) { return tokenize(str).reduce((w, t) => w + tokW(ctx, t, size), 0); }
function drawInline(ctx, str, x, base, size, color) {
  for (const t of tokenize(str)) { drawTok(ctx, t, x, base, size, color); x += tokW(ctx, t, size); }
}
function tokW(ctx, t, size) {
  if (t.t === 'nl') return 0;
  if (t.t === 'sp') return size * 0.22;
  if (t.t === 'frac') { const s2 = size * 0.8; return Math.max(inlineW(ctx, t.num, s2), inlineW(ctx, t.den, s2)) + size * 0.36; }
  ctx.font = tokFont(t, size);
  let w = ctx.measureText(t.s).width;
  if (OPS.includes(t.s)) w += size * 0.26;
  if (/^[A-Za-z]+$/.test(t.s)) w += size * 0.06;
  return w;
}
function drawTok(ctx, t, x, base, size, color) {
  const col = t.col || color;
  if (t.t === 'sp' || t.t === 'nl') return;
  if (t.t === 'frac') {
    const s2 = size * 0.8, w = tokW(ctx, t, size), cx = x + w / 2;
    const bar = base - size * 0.32;
    const wn = inlineW(ctx, t.num, s2), wd = inlineW(ctx, t.den, s2);
    drawInline(ctx, t.num, cx - wn / 2, bar - size * 0.2, s2, col);
    drawInline(ctx, t.den, cx - wd / 2, bar + s2 * 0.98, s2, col);
    ctx.fillStyle = col; ctx.fillRect(x + size * 0.12, bar - size * 0.03, w - size * 0.24, Math.max(2, size * 0.055));
    return;
  }
  ctx.font = tokFont(t, size); ctx.fillStyle = col;
  ctx.fillText(t.s, x + (OPS.includes(t.s) ? size * 0.13 : 0), base);
}
function layout(ctx, str, size, maxW, lh = size * 1.62) {
  const lines = []; let cur = { toks: [], w: 0, frac: false };
  for (const t of tokenize(str)) {
    if (t.t === 'nl') { lines.push(cur); cur = { toks: [], w: 0, frac: false }; continue; }
    t.w = tokW(ctx, t, size);
    const noStart = t.t === 'text' && NO_START.includes(t.s);
    if (cur.w + t.w > maxW && cur.toks.length && !noStart) {
      lines.push(cur); cur = { toks: [], w: 0, frac: false };
      if (t.t === 'sp') continue;
    }
    cur.toks.push(t); cur.w += t.w; if (t.t === 'frac') cur.frac = true;
  }
  if (cur.toks.length) lines.push(cur);
  let h = 0; for (const l of lines) { l.h = l.frac ? Math.max(lh, size * 2.5) : lh; h += l.h; }
  return { lines, h, size, w: Math.max(0, ...lines.map(l => l.w)) };
}
function drawLay(ctx, lay, x, top, color = C.ink, align = 'left', boxW = 0) {
  let y = top;
  for (const l of lay.lines) {
    let cx = align === 'center' ? x + (boxW - l.w) / 2 : align === 'right' ? x + boxW - l.w : x;
    const base = l.frac ? y + l.h / 2 + lay.size * 0.5 : y + l.h / 2 + lay.size * 0.36;
    for (const t of l.toks) { drawTok(ctx, t, cx, base, lay.size, color); cx += t.w; }
    y += l.h;
  }
  return y;
}
function para(ctx, str, x, top, maxW, size = 30, opt = {}) {
  const lay = layout(ctx, str, size, maxW, opt.lh || size * 1.62);
  return drawLay(ctx, lay, x, top, opt.color || C.ink, opt.align || 'left', maxW);
}
function text(ctx, s, x, y, font, color = C.ink, align = 'left', spacing = 0) {
  USED.add(s);
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align;
  if ('letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
  ctx.fillText(s, x, y);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  ctx.textAlign = 'left';
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function hand(ctx, s, x, y, size, rot = -0.04, color = C.orange, align = 'left') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); text(ctx, s, 0, 0, `${size}px ${F_HAND}`, color, align); ctx.restore();
}
// 手绘感马克笔高亮
function marker(ctx, x, y, w, h) {
  ctx.save(); ctx.fillStyle = C.hl; ctx.beginPath();
  ctx.moveTo(x + 4, y + 3); ctx.lineTo(x + w - 2, y); ctx.lineTo(x + w + 3, y + h - 4); ctx.lineTo(x - 2, y + h);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.orange; ctx.fillRect(x - 14, y + 4, 5, h - 8);
  ctx.restore();
}

/* ================================================================
   纸张与页面框架
   ================================================================ */
const PAPER = (() => {
  const c = mk(CW, CH), x = c.getContext('2d');
  x.fillStyle = C.paper; x.fillRect(0, 0, CW, CH);
  const img = x.getImageData(0, 0, CW, CH), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 9; d[i] += n; d[i + 1] += n; d[i + 2] += n * 1.1; }
  x.putImageData(img, 0, 0);
  x.strokeStyle = 'rgba(120, 100, 70, 0.05)'; x.lineWidth = 1;

function infoBox(ctx, str, y, size = 30) {
  const lay = layout(ctx, str, size, LW - 70);
  rr(ctx, LX, y, LW, lay.h + 36, 10); ctx.fillStyle = C.box; ctx.fill();
  ctx.fillStyle = C.orange; ctx.fillRect(LX, y, 8, lay.h + 36);
  drawLay(ctx, lay, LX + 40, y + 18);

}
// 结果框
function resultBox(ctx, str, y, done) {
  rr(ctx, LX, y, LW, 110, 14); ctx.lineWidth = 3; ctx.strokeStyle = done ? C.orange : '#e3d6c2'; ctx.stroke();
  ctx.fillStyle = done ? 'rgba(255, 240, 222, 0.9)' : 'rgba(255, 250, 240, 0.7)'; ctx.fill();
  drawLay(ctx, layout(ctx, str, done ? 38 : 30, LW - 60), LX + 36, y + (done ? 20 : 30));

// 纬线与经线对照表
function compareTable(ctx, y) {
  const rows = [['', '纬　线', '经　线'], ['形状', '圆', '半圆'], ['长度', '赤道最长，向两极变短', '全部相等'],
    ['指示', '东西方向', '南北方向'], ['度数', '0°～90°（N / S）', '0°～180°（E / W）']];
  const cw = [150, 350, 350], rh = 64;
  rows.forEach((row, r) => {
    let x = LX;
    if (r === 0) { rr(ctx, LX, y, LW, rh, 10); ctx.fillStyle = '#fbe3cc'; ctx.fill(); }
    row.forEach((s, c) => {
      if (s) {
        const lay = layout(ctx, r === 0 || c === 0 ? `{b:${s}}` : s, 27, cw[c] - 20);
        drawLay(ctx, lay, x + 10, y + (rh - lay.h) / 2, r === 0 ? C.ink : c === 0 ? C.soft : C.ink, 'center', cw[c] - 20);
      }
      x += cw[c];
    });
    y += rh;
    ctx.fillStyle = C.line; ctx.fillRect(LX, y - 1, LW, 2);
  });
  ctx.fillStyle = C.line; ctx.fillRect(LX + cw[0], y - rh * 4, 2, rh * 4); ctx.fillRect(LX + cw[0] + cw[1], y - rh * 5, 2, rh * 5);
  return y;
}

/* ================================================================
   立体地球仪：一张会变形的世界地图
   a：地图从书页上立起来；c：左右卷成圆筒；s：上下收拢成球。
   三个参数都为 0 时，网格正好盖在右页印着的地图上。
   ================================================================ */
const Y_AXIS = new THREE.Vector3(0, 1, 0);
const Q_LIE = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
const Q_STAND = new THREE.Quaternion();
const P_LIE = new THREE.Vector3(0, -R + 0.012, ZM), P_STAND = new THREE.Vector3(0, GY, ZG);
const D2R = THREE.MathUtils.degToRad;
const wrapA = a => ((a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
// 球面上 (lat, lon) 的位置（地球仪自身坐标；lon = 0 朝向读者）
const sph = (lat, lon, r = R) => new THREE.Vector3(r * Math.cos(D2R(lat)) * Math.sin(D2R(lon)), r * Math.sin(D2R(lat)), r * Math.cos(D2R(lat)) * Math.cos(D2R(lon)));
let EARTH_TEX = null;
const matGold = new THREE.MeshStandardMaterial({ color: C.gold, metalness: .45, roughness: .42 });
const matBase = new THREE.MeshStandardMaterial({ color: '#3a332d', roughness: .6 });

function makeGlobe(root, sec) {
  const pose = new THREE.Group(); root.add(pose);
  const tilt = new THREE.Group(); pose.add(tilt);
  const spin = new THREE.Group(); tilt.add(spin);
  // 地图网格：(SU+1)×(SV+1) 个顶点，u 是经度、v 是纬度
  const NV = (SU + 1) * (SV + 1);
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(NV * 3), nor = new Float32Array(NV * 3), uv = new Float32Array(NV * 2), idx = [];
  for (let j = 0; j <= SV; j++) for (let i = 0; i <= SU; i++) {
    const n = j * (SU + 1) + i; uv[n * 2] = i / SU; uv[n * 2 + 1] = j / SV;
    if (i < SU && j < SV) { const a = n, b = n + 1, c = n + SU + 1, d = c + 1; idx.push(a, b, c, b, d, c); }
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(idx);
  const earth = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: EARTH_TEX, roughness: .8, side: THREE.DoubleSide }));
  earth.castShadow = true; earth.receiveShadow = true;
  const ovCv = mk(2048, 1024), ovTex = canvasTex(ovCv);
  const over = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: ovTex, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4 }));
  over.renderOrder = 2;
  spin.add(earth, over);
  const ov = ovDefault(sec);
  const drawOv = () => { const x = ovCv.getContext('2d'); x.clearRect(0, 0, 2048, 1024); drawOverlay(x, 2048, 1024, ov); ovTex.needsUpdate = true; };
  drawOv(); DRAWABLES.push(drawOv);

  // 地轴、半圆支架、两极小牌、自转箭头（随地轴一起倾斜）
  const extras = new THREE.Group(); tilt.add(extras);
  const axisRod = M(new THREE.CylinderGeometry(0.03, 0.03, RH * 2 + 0.12, 10), matGold); extras.add(axisRod);
  const arc = []; for (let i = 0; i <= 64; i++) { const t = i / 64 * Math.PI; arc.push(new THREE.Vector3(0, Math.cos(t) * RH, -Math.sin(t) * RH)); }
  const holder = M(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(arc), 64, 0.045, 8, false), matGold); extras.add(holder);
  const badges = { N: makeBadge(C.blue), S: makeBadge(C.blue) };
  badges.N.setLabel('N'); badges.S.setLabel('S');
  badges.N.position.y = RH + 0.42; badges.S.position.y = -RH - 0.42;
  for (const k in badges) { badges[k].visible = false; extras.add(badges[k]); }
  const arrow = new THREE.Group(); arrow.visible = false; extras.add(arrow);
  {
    const R2 = R * 1.2, th0 = -2.3, th1 = 0.75, pts = [];
    for (let i = 0; i <= 48; i++) { const t = lerp(th0, th1, i / 48); pts.push(new THREE.Vector3(R2 * Math.sin(t), 0, R2 * Math.cos(t))); }
    const m = new THREE.MeshStandardMaterial({ color: C.orange, roughness: .5, emissive: C.orange, emissiveIntensity: .25 });
    arrow.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, 0.05, 8, false), m));
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.34, 16), m);
    head.position.set(R2 * Math.sin(th1), 0, R2 * Math.cos(th1));
    head.quaternion.setFromUnitVectors(Y_AXIS, new THREE.Vector3(Math.cos(th1), 0, -Math.sin(th1)));
    arrow.add(head);
  }
  // 竖直参考线（不随地轴倾斜），用来比较地轴的倾斜
  const vline = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, RH * 2 + 0.9, 8),
    new THREE.MeshBasicMaterial({ color: C.soft, transparent: true, opacity: .7 }));
  vline.visible = false; pose.add(vline);
  // 底座和立柱：接在地轴南端下方
  const stand = new THREE.Group(); root.add(stand);
  const sx = -RH * GS * Math.sin(TILT), sTop = GY - RH * GS * Math.cos(TILT);
  stand.position.set(sx, 0, ZG);
  const base = ink(M(new THREE.CylinderGeometry(0.85, 0.95, 0.14, 48), matBase)); base.position.y = 0.07; stand.add(base);
  const post = M(new THREE.CylinderGeometry(0.06, 0.1, sTop - 0.14, 16), matGold); post.position.y = 0.14 + (sTop - 0.14) / 2; stand.add(post);

  const shape = { a: 0, c: 0, s: 0 };
  // 计算每个顶点：圆筒（卷曲程度 c）与球面之间按 s 插值
  function setShape(a, c, s) {
    shape.a = a; shape.c = c; shape.s = s;
    const cc = Math.max(c, 1e-4), rho = R / cc;
    for (let j = 0; j <= SV; j++) {
      const lat = (j / SV - 0.5) * Math.PI, Y = lat * R, cl = Math.cos(lat), sl = Math.sin(lat);
      for (let i = 0; i <= SU; i++) {
        const lon = (i / SU - 0.5) * 2 * Math.PI, phi = lon * cc, n = (j * (SU + 1) + i) * 3;
        const x0 = rho * Math.sin(phi), z0 = rho * Math.cos(phi) + R - rho;
        const x1 = R * cl * Math.sin(lon), y1 = R * sl, z1 = R * cl * Math.cos(lon);
        pos[n] = lerp(x0, x1, s); pos[n + 1] = lerp(Y, y1, s); pos[n + 2] = lerp(z0, z1, s);
      }
    }
    geo.attributes.position.needsUpdate = true;
    if (s > 0.999) { for (let n = 0; n < NV * 3; n += 3) { nor[n] = pos[n] / R; nor[n + 1] = pos[n + 1] / R; nor[n + 2] = pos[n + 2] / R; } geo.attributes.normal.needsUpdate = true; }
    else geo.computeVertexNormals();
    geo.computeBoundingSphere();
    pose.position.lerpVectors(P_LIE, P_STAND, a);
    pose.quaternion.slerpQuaternions(Q_LIE, Q_STAND, a);
    pose.scale.setScalar(lerp(1, GS, s));
    tilt.rotation.z = -TILT * s;
    // 地轴、支架、底座在地图收拢成球的最后阶段长出来
    const e = clamp((s - 0.75) / 0.25, 0, 1);
    extras.visible = e > 0.001; extras.scale.setScalar(Math.max(0.001, ease.back(e)));
    stand.visible = e > 0.001; stand.scale.set(1, Math.max(0.001, ease.out(e)), 1);
  }
  setShape(0, 0, 0);
  return {
    pose, tilt, spin, ov, drawOv, badges, arrow, vline, axisRod, shape, setShape,
    // 转到让经度 lon 正对读者（走最近的方向）
    face(lon, ms, ctl) {
      const to = -D2R(lon), from = to + wrapA(spin.rotation.y - to);
      spin.rotation.y = from;
      return tween(ms, p => spin.rotation.y = lerp(from, to, p), ease.io, ctl);
    },
  };
}

// 叠加层动画：每帧改 ov 后重画
function ovTween(sc, ms, fn, ez = ease.io, ctl) { return tween(ms, p => { fn(p); sc.gb.drawOv(); }, ez, ctl); }
const popBadge = (bd, ctl) => { bd.visible = true; return tween(320, p => bd.scale.setScalar(0.62 * Math.max(.001, p)), ease.back, ctl); };
function setStep(i, k) { S.step[i] = k; redraw(i, 'L'); narrate(i, k); }

function makeGlobeScene(i, play) {
  const root = contentRoot();
  const gb = makeGlobe(root, i);
  const msg = floatCard(3.8, 0.62); msg.hinge.position.set(0, GY + RH * GS + 0.55, ZG); root.add(msg.hinge);
  msg.mesh.castShadow = false;
  const sc = {
    root, gb, msg,
    // 立体化：地图立起 → 卷成圆筒 → 收成球，同时转到中国正对读者
    pop(P) {
      const a = ease.io(clamp(P / 0.34, 0, 1)), c = ease.io(clamp((P - 0.28) / 0.38, 0, 1)), s = ease.io(clamp((P - 0.6) / 0.4, 0, 1));
      gb.setShape(a, c, s); gb.spin.rotation.y = HOME_SPIN * s;
    },
    // 清空讲解留下的痕迹
    reset() {
      Object.assign(gb.ov, ovDefault(i)); gb.drawOv();
      msg.reset(); gb.arrow.visible = false; gb.vline.visible = false;
      for (const k in gb.badges) gb.badges[k].visible = false;
      gb.axisRod.scale.set(1, 1, 1); gb.axisRod.material = matGold;
      if (gb.shape.s > 0.999) gb.tilt.rotation.z = -TILT;
      if (i === 3) { S.res = {}; S.checked = false; }
    },
    // 回到地球仪的样子（折好、中国朝前）
    async relax(ctl, ms = 900) {
      const { a, c, s } = gb.shape, r0 = gb.spin.rotation.y, to = HOME_SPIN + 2 * Math.PI * Math.round((r0 - HOME_SPIN) / (2 * Math.PI));
      S.unfold = false; ui();
      await tween(ms, p => { gb.setShape(lerp(a, 1, p), lerp(c, 1, p), lerp(s, 1, p)); gb.spin.rotation.y = lerp(r0, to, p); }, ease.io, ctl);
      gb.spin.rotation.y = HOME_SPIN;
    },
    // 摊平：先把 180° 经线转到背后，再上下展开、左右展开，地图正对读者立着
    async unfold(ctl, ms = 2200) {
      S.unfold = true; S.spin = false; gb.arrow.visible = false; ui();
      const r0 = gb.spin.rotation.y, to = 2 * Math.PI * Math.round(r0 / (2 * Math.PI)), s0 = gb.shape.s, c0 = gb.shape.c;
      await tween(ms * 0.3, p => gb.spin.rotation.y = lerp(r0, to, p), ease.io, ctl);
      gb.spin.rotation.y = 0;
      await tween(ms * 0.7, p => gb.setShape(1, lerp(c0, 0, clamp(p * 1.6 - 0.45, 0, 1)), lerp(s0, 0, clamp(p * 1.7, 0, 1))), ease.io, ctl);
    },
    play: ctl => play(sc, ctl),
  };
  return sc;
}

/* ---- 第 1 节：认识地球仪 ---- */

async function playLines(sc, ctl) {

  if (S.playing) cancelPlay();
  S.busy = true; ui();
  const ov = sc.gb.ov, a0 = ov.lat / LAT_ORDER.length, l0 = ov.labels;
  await ovTween(sc, 1200, p => { const v = lerp(a0, on ? 1 : 0, p); ov.lat = v * LAT_ORDER.length; ov.lon = v * LON_ORDER.length; ov.labels = lerp(l0, on ? 1 : 0, p); });
  redraw(S.spread, 'R');
  S.busy = false; ui();
}
const gridOn = () => { const sc = SCENES[S.spread]; return !!sc && sc.gb.ov.lat > 0.5; };
// 自转：地球仪绕地轴自西向东转，显示箭头
async function setSpin(on) {
  const sc = SCENES[S.spread];
  if (!sc || !S.built[S.spread] || S.busy) return;
  if (S.playing) cancelPlay();
  if (on && S.unfold) { S.busy = true; await sc.relax(null, 1400); S.busy = false; }
  S.spin = on; sc.gb.arrow.visible = on; ui();
}
// 展开：地球仪摊成一张立着的世界地图；再点一次卷回去
async function setUnfold(on) {
  const sc = SCENES[S.spread];
  if (!sc || !S.built[S.spread] || S.busy) return;
  if (S.playing) cancelPlay();
  S.busy = true;
  if (on) await sc.unfold(null, 2000); else await sc.relax(null, 1800);
  S.busy = false; ui();
}

/* ================================================================
   UI
   ================================================================ */
const $ = id => document.getElementById(id);
let hintTimer = 0;
function hint(s) { const h = $('hint'); if (s) { h.textContent = s; h.classList.remove('off'); } else h.classList.add('off'); }
function ui() {
  const i = S.spread, sc = SCENES[i];
  $('pageLabel').innerHTML = `<b>${SPREADS[i].pn}</b>${SPREADS[i].title}`;
  $('bPrev').disabled = S.busy || i === 0;
  $('bNext').disabled = S.busy || i === SPREADS.length - 1;
  $('bBuild').disabled = !sc || S.busy;
  $('bBuild').classList.toggle('on', !!S.built[i]);
  $('bBuild').querySelector('.txt').textContent = S.built[i] ? '平面' : '立体';
  $('bPlay').disabled = !sc || S.busy;
  $('bPlay').querySelector('.txt').textContent = S.playing ? '重播' : '播放';
  const live = !!sc && S.built[i];
  for (const b of ['bGrid', 'bSpin', 'bUnfold']) { $(b).classList.toggle('hide', !live); $(b).disabled = S.busy; }
  $('bGrid').classList.toggle('on', gridOn()); $('bSpin').classList.toggle('on', S.spin); $('bUnfold').classList.toggle('on', S.unfold);
  $('bUnfold').querySelector('.txt').textContent = S.unfold ? '卷起' : '展开';
  $('ab').classList.toggle('hide', i !== 3);
  $('bPt').textContent = `${S.cur} 点`;
  $('gLat').textContent = fmtLat(S.guess[S.cur].lat); $('gLon').textContent = fmtLon(S.guess[S.cur].lon);
  document.querySelectorAll('.menu button').forEach((b, k) => b.classList.toggle('cur', k === i));
  if (!S.opened) return;
  clearTimeout(hintTimer);
  let h = '';
  if (S.playing) { hint(''); return; }
  if (sc && !S.built[i] && !S.busy) h = '点击右页的地图，把它卷成地球仪';
  else if (i === 3 && S.built[3] && !S.busy) h = '在工具栏里选点，填好 A、B、C 的纬度和经度，再点 ▶ 验证';
  else if (sc && S.built[i] && !S.busy) h = '拖动旋转 · 「经纬网」「自转」「展开」 · 点 ▶ 听讲解';
  else if (i === 0 && !S.busy) h = '点击右页翻到下一页，点击左页回到上一页';
  hint(h);
  if (h) hintTimer = setTimeout(() => hint(''), 4200);
}
function closeMenu() { $('menu').classList.add('off'); }
$('menu').innerHTML = SPREADS.map((s, k) => `<button data-i="${k}">${s.title}<i>${s.pn}</i></button>`).join('');
$('menu').addEventListener('click', e => { const b = e.target.closest('button'); if (b) goTo(+b.dataset.i); });
$('bMenu').onclick = () => $('menu').classList.toggle('off');
$('bPrev').onclick = () => flip(-1);
$('bNext').onclick = () => flip(1);
$('bBuild').onclick = () => setBuilt(!S.built[S.spread]);
$('bPlay').onclick = () => play();
$('bVoice').onclick = () => setVoice(!voiceOn);
$('bView').onclick = () => {
  if (S.busy) return;
  S.view = S.built[S.spread] && S.view !== 'anim' ? 'anim' : 'read';
  flyTo(S.view === 'anim' ? animView() : openView(), 900);
};
document.querySelectorAll('.ab button[data-k]').forEach(b => b.onclick = () => setGuess(b.dataset.k, +b.dataset.d));
$('bPt').onclick = () => nextPoint();
$('bGrid').onclick = () => setGrid(!gridOn());
$('bSpin').onclick = () => setSpin(!S.spin);
$('bUnfold').onclick = () => setUnfold(!S.unfold);
addEventListener('keydown', e => {
  if (!S.opened) { if (e.key === 'Enter' || e.key === ' ') openBook(); return; }
  if (e.key === 'ArrowRight') flip(1);
  else if (e.key === 'ArrowLeft') flip(-1);
  else if (e.key === ' ') { e.preventDefault(); play(); }
  else if (e.key === 'Enter') setBuilt(!S.built[S.spread]);
  else if (e.key === 'g' || e.key === 'G') setGrid(!gridOn());
  else if (e.key === 'r' || e.key === 'R') setSpin(!S.spin);
  else if (e.key === 'u' || e.key === 'U') setUnfold(!S.unfold);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  // 窗口变化后重新取景，保证整个跨页仍在画面内
  if (S.opened && !S.busy) flyTo(S.view === 'anim' ? animView() : openView(), 300);
});

/* ================================================================
   启动：等底图与字体 → 绘制 → 渲染循环
   ================================================================ */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function loadFonts() {
  const link = $('gfont');
  await Promise.race([new Promise(r => link.sheet ? r() : link.addEventListener('load', r, { once: true })), sleep(3000)]);
  redrawAll();   // 第一次绘制：收集用到的字符
  const sample = [...USED].join('') + '0123456789？✓✗°NSEW经纬网自转展开卷起北半球南半球东西本初子午线';
  const loads = ['400', '700', '900'].map(w => document.fonts.load(`${w} 32px "Noto Serif SC"`, sample))
    .concat(document.fonts.load(`32px "Ma Shan Zheng"`, sample));
  await Promise.race([Promise.allSettled(loads), sleep(6000)]);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  runTweens(now);
  updatePeek();
  const sc = SCENES[S.spread];
  if (sc && S.spin && S.built[S.spread] && !S.playing && !S.unfold) { sc.gb.spin.rotation.y += dt * 0.45; sc.gb.arrow.rotation.y += dt * 0.45; }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

(async () => {
  Object.assign(controls, {
    enableDamping: true, dampingFactor: .08, enablePan: false,
    minDistance: 8, maxDistance: 46, minPolarAngle: 0.12, maxPolarAngle: 1.3,
    minAzimuthAngle: -1.3, maxAzimuthAngle: 1.3,
  });
  const v = closedView(); camera.position.copy(v.pos); controls.target.copy(v.target);
  await loadEarth();
  EARTH_TEX = new THREE.Texture(EARTH_IMG); EARTH_TEX.colorSpace = THREE.SRGBColorSpace; EARTH_TEX.anisotropy = ANISO; EARTH_TEX.needsUpdate = true;
  buildScenes();
  await loadFonts();
  redrawAll();
  useImage(texL, PAGE_CANVAS[0].L); useImage(texR, PAGE_CANVAS[0].R);
  requestAnimationFrame(frame);
  $('loading').classList.add('off');
  ui();
  hint('点击书本，打开它');
  setVoice(voiceOn);
  document.fonts.addEventListener('loadingdone', () => redrawAll());
  window.__book = { S, SCENES, camera, book, setBuilt, flip, play, goTo, setGuess, setUnfold, setGrid, setSpin, openBook };
})();
</script>
